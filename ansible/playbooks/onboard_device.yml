---
# DRAFT — NEVER EXECUTED. Requires -e confirm_execution=true (review gate).
#
# Device onboarding, run over SSH as an operator account: creates the backup
# and metrics service accounts (replaces the retired
# device-onboarding/add-backup-users.sh, plus mktxp which was hand-made):
#   oxidized       group netops-backup-ro   (ssh,read)            key-only
#   oxidized-full  group netops-backup-full (ssh,read,sensitive)  key-only
#   mktxp          group mktxp_group        (api,read)            sops password
# Idempotent: existing groups/users/keys are left alone; the mktxp password is
# (re)set from sops every run so device and collector can never drift.
# Key custody: the committed *.pub files mirror the keypairs living on
# rpi.sco (README bootstrap). If those keypairs are ever regenerated (host
# rebuild without restoring them), update the .pub files here and run with
# -e rotate_backup_keys=true to replace the device-side keys — the default
# import skips users that already have one.
# Usage (after PR review):
#   ansible-playbook playbooks/onboard_device.yml -e confirm_execution=true \
#     -l r1.sco.memhamwan.net [-e ansible_user=turnrye] [-e rotate_backup_keys=true]
- name: Onboard backup/metrics service accounts on RouterOS
  hosts: routeros
  gather_facts: false
  vars:
    ansible_user: "{{ lookup('env', 'USER') }}"
    key_dir: "{{ playbook_dir }}/../roles/routeros_baseline/files"
  pre_tasks:
    - name: Execution gate — this play is a draft pending review
      ansible.builtin.assert:
        that: confirm_execution | default(false) | bool
        fail_msg: "DRAFT play. Pass -e confirm_execution=true only after PR review."
      run_once: true

    # same preflight as bootstrap_ansible_user.yml — see comment there
    - name: Preflight — look up pinned host key
      ansible.builtin.command: ssh-keygen -F "[{{ inventory_hostname }}]:{{ ansible_port | default(222) }}"
      register: hostkey_check
      changed_when: false
      failed_when: false
      delegate_to: localhost

    - name: Preflight — libssh needs a pinned ssh-rsa host key
      ansible.builtin.assert:
        that: "'ssh-rsa' in hostkey_check.stdout"
        fail_msg: >-
          No ssh-rsa host key for [{{ inventory_hostname }}]:{{ ansible_port | default(222) }}
          in ~/.ssh/known_hosts. Run `ansible-playbook playbooks/seed_known_hosts.yml`.
          If the device is missing from ansible/known_hosts (dark when last
          scanned), scan it from rpi.sco (`ssh-keyscan -p 222 -t rsa <host>`),
          add the line via PR, then re-run the seed play.

    - name: Load secrets from sops (mktxp password)
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../secrets/secrets.sops.yaml"
      delegate_to: localhost

  tasks:
    - name: Ensure service groups
      community.routeros.command:
        commands:
          - ':if ([:len [/user group find name=netops-backup-ro]] = 0) do={/user group add name=netops-backup-ro policy=ssh,read}'
          - ':if ([:len [/user group find name=netops-backup-full]] = 0) do={/user group add name=netops-backup-full policy=ssh,read,sensitive}'
          - ':if ([:len [/user group find name=mktxp_group]] = 0) do={/user group add name=mktxp_group policy=api,read}'
      changed_when: true

    # per-device self-signed TLS cert so api-ssl (8729) can carry mktxp and
    # the baseline role: encrypted transport defeats passive capture on radio
    # links (a source ACL does not). Self-signed + no client validation is
    # step one; an internal CA is the follow-up (routeros_baseline README).
    # 8728 stays up here — the baseline's api_lockdown disables it once
    # everything has moved (migration order in the role README).
    - name: Ensure api-ssl certificate and service
      community.routeros.command:
        commands:
          - ':if ([:len [/certificate find name=api-ssl]] = 0) do={/certificate add name=api-ssl common-name={{ inventory_hostname }} key-size=2048 days-valid=3650 key-usage=digital-signature,key-encipherment,tls-server; /certificate sign api-ssl}'
          - '/ip service set api-ssl certificate=api-ssl port=8729 disabled=no'
      changed_when: true

    # no_log: the commands embed then-valid passwords
    - name: Ensure backup users (random discarded passwords)
      community.routeros.command:
        commands:
          - ':if ([:len [/user find name=oxidized]] = 0) do={/user add name=oxidized group=netops-backup-ro password="{{ lookup("community.general.random_string", length=32, special=false) }}"}'
          - ':if ([:len [/user find name=oxidized-full]] = 0) do={/user add name=oxidized-full group=netops-backup-full password="{{ lookup("community.general.random_string", length=32, special=false) }}"}'
      changed_when: true
      no_log: true

    # plain scp from the controller, NOT net_put — see the identical comment
    # in bootstrap_ansible_user.yml (net_put wedges the network_cli session)
    - name: Upload backup public keys
      ansible.builtin.command: >-
        scp -O -P {{ ansible_port | default(222) }} -o BatchMode=yes
        {{ key_dir }}/{{ item }}
        {{ ansible_user }}@{{ inventory_hostname }}:/{{ item }}
      delegate_to: localhost
      changed_when: true
      loop: [oxidized.pub, oxidized-full.pub]

    # rotation: drop existing keys so the import below re-runs with the new ones
    - name: Remove existing backup ssh keys (rotate_backup_keys)
      community.routeros.command:
        commands:
          - '/user ssh-keys remove [find user=oxidized]'
          - '/user ssh-keys remove [find user=oxidized-full]'
      changed_when: true
      when: rotate_backup_keys | default(false) | bool

    - name: Import backup ssh keys
      community.routeros.command:
        commands:
          - ':if ([:len [/user ssh-keys find user=oxidized]] = 0) do={/user ssh-keys import public-key-file=oxidized.pub user=oxidized}'
          - ':if ([:len [/user ssh-keys find user=oxidized-full]] = 0) do={/user ssh-keys import public-key-file=oxidized-full.pub user=oxidized-full}'
      changed_when: true

    # key auth works from here on; scramble again so no password that ever
    # existed during creation remains valid (same pattern as the bootstrap play)
    - name: Re-scramble backup user passwords (never logged, never recorded)
      community.routeros.command:
        commands:
          - '/user set [find name=oxidized] password="{{ lookup("community.general.random_string", length=32, special=false) }}"'
          - '/user set [find name=oxidized-full] password="{{ lookup("community.general.random_string", length=32, special=false) }}"'
      changed_when: true
      no_log: true

    # mktxp authenticates over the API with this password
    - name: Ensure mktxp user with sops password
      community.routeros.command:
        commands:
          - ':if ([:len [/user find name=mktxp]] = 0) do={/user add name=mktxp group=mktxp_group password="{{ mktxp_password }}"}'
          - '/user set [find name=mktxp] password="{{ mktxp_password }}"'
      changed_when: true
      no_log: true

    # converge, not just create-if-absent: pre-existing groups/users with
    # drifted policies or membership must end up in the expected state
    # (set on an empty [find] is a RouterOS no-op, so this is safe even if
    # an account doesn't exist on this device)
    - name: Converge group policies and user membership
      community.routeros.command:
        commands:
          - '/user group set [find name=netops-backup-ro] policy=ssh,read'
          - '/user group set [find name=netops-backup-full] policy=ssh,read,sensitive'
          - '/user group set [find name=mktxp_group] policy=api,read'
          - '/user set [find name=oxidized] group=netops-backup-ro'
          - '/user set [find name=oxidized-full] group=netops-backup-full'
          - '/user set [find name=mktxp] group=mktxp_group'
      changed_when: true
