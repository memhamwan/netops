---
# Deploy DNS + NTP (and, when explicitly enabled, anycast) to the site
# service hosts. Not router config — but enabling anycast makes this host an
# OSPF speaker on the site LAN, so that step carries its own confirmation
# flag on top of PR review. See docs/site-services-design.md.
#
#   ansible-playbook playbooks/site_services.yml                  # M1: serve, announce nothing
#   ansible-playbook playbooks/site_services.yml \
#     -e anycast_enabled=true -e anycast_confirm=true             # M2+: announce
#   ansible-playbook playbooks/site_services.yml \
#     -e nsd_enabled=true -e nsd_confirm=true                     # authoritative NSD
#                                                                 # (record parity first!)
- name: Deploy site network services
  hosts: service_hosts
  become: true
  gather_facts: false
  pre_tasks:
    # Only the anycast path needs a secret (the OSPF key), so M1 deploys
    # without sops access at all — no age key, no direnv, nothing to set up
    # beyond ssh. That keeps the low-risk step genuinely low-friction.
    - name: Load secrets from sops (only anycast needs the OSPF key)
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../secrets/secrets.sops.yaml"
      delegate_to: localhost
      become: false
      when: anycast_enabled | default(false) | bool

    - name: Load extra DNS records
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventory/dns_extra_records.yml"

    # Announcing means joining OSPF and claiming addresses the whole fleet
    # points at. Requiring a second, explicit flag keeps that from ever being
    # a side effect of a routine redeploy.
    - name: Enabling anycast requires explicit confirmation
      ansible.builtin.assert:
        that: anycast_confirm | default(false) | bool
        fail_msg: >-
          anycast_enabled is true but anycast_confirm is not set. Re-run with
          -e anycast_confirm=true once the change is intended and reviewed.
        quiet: true
      when: anycast_enabled | default(false) | bool

    # Enabling NSD flips on-net resolution of the whole internal zone from
    # unbound's local-data to a stub-zone into NSD — a stub-zone has no
    # fall-through, so any memhamwan.net name not yet in the rendered zone will
    # NXDOMAIN on-net. Requiring a second flag keeps that off a routine
    # redeploy. Confirm record parity first (docs/dns-authority-design.md, D1).
    - name: Enabling authoritative NSD requires explicit confirmation
      ansible.builtin.assert:
        that: nsd_confirm | default(false) | bool
        fail_msg: >-
          nsd_enabled is true but nsd_confirm is not set. NSD becomes
          authoritative for the whole internal zone and unbound resolves it via
          a stub-zone (no fall-through). Ensure record parity, then re-run with
          -e nsd_confirm=true.
        quiet: true
      when: nsd_enabled | default(false) | bool
  roles:
    - site_services
