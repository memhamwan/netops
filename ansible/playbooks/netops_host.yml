---
# Deploy the backup/monitoring stack to rpi.sco.
#   ansible-playbook playbooks/netops_host.yml
# (Not router config — outside the router-change review gate.)
- name: Deploy netops stack to backup host
  hosts: netops_hosts
  become: true
  gather_facts: false
  pre_tasks:
    - name: Load secrets from sops
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../secrets/secrets.sops.yaml"
      delegate_to: localhost
      become: false

    # before any template renders: mktxp.conf and router.db must leave out
    # the quarantined hosts, whose membership is private (sops)
    - name: Merge the private quarantine list
      ansible.builtin.include_role:
        name: routeros_lifecycle
        apply:
          become: false
  roles:
    - netops_host
