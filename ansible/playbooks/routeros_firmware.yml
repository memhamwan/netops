---
# DRAFT — NEVER EXECUTED. Requires -e confirm_execution=true (review gate).
#
# ===========================================================================
# WHAT THIS DOES
# ===========================================================================
# Upgrades RouterOS firmware across the wireless chains in THREE plays:
#
#   1. PLAN   — order the in-scope devices deepest-first from
#               ansible/firmware_topology.yml (RoMON-derived) and refuse any
#               host we cannot place in a chain (blast radius unknown).
#   2. CHECK  — PARALLEL, read-only. Every in-scope device is queried at once:
#               installed version, channel's latest, and whether it needs an
#               upgrade. Cheap and low-bandwidth (a version query, NOT the
#               package download). Devices already on the target RouterOS AND
#               RouterBOARD firmware are dropped here, so the serial phase only
#               visits devices that actually change. v6->v7 and unreachable-
#               target problems fail the whole campaign HERE, before anything
#               reboots.
#   3. APPLY  — SERIAL, one device at a time, DEEPEST FIRST. Downloads (or
#               uploads, offline) the package and reboots, then upgrades
#               RouterBOARD firmware and verifies. Deepest-first means each
#               reboot only takes down that device and gear already upgraded —
#               never a device still ahead of us in the run; the core (r1.sco,
#               depth 0) reboots the whole fleet, so it goes last.
#
# WHY DOWNLOADS STAY SERIAL: devices on one chain share a single radio
# backhaul. Downloading to several at once would contend for that link and
# cause the transient timeouts this playbook already fights (see the retry
# loop). So only the harmless checks are parallelized; the byte-moving stays
# one-at-a-time.
#
# ===========================================================================
# HOW TO RUN IT AGAINST THE SITES WE HAVE ACTIVE TODAY
# ===========================================================================
# Only the SCO / FTN / HIL / MNO RoMON domain is mapped in
# firmware_topology.yml today; those are the sites you can upgrade with this
# playbook right now. atl, azo, mch, ret and the leb.* group reach the core
# over routed (L3) links RoMON did not cross — they have NO topology entry ON
# PURPOSE and the PLAN play will refuse them until they are mapped (or scoped
# out with -l). See the COVERAGE / REFRESHING notes in firmware_topology.yml.
#
# Runs over SSH as a human OPERATOR, not the `ansible` service account:
# firmware upgrades reboot the device, and the netops-ansible group deliberately
# lacks the `reboot` policy (operators are group `full`). ansible_user defaults
# to $USER, key-based — same auth model as onboard_device.yml.
#
# 0) First real run after review — prove it on ONE leaf before a whole chain:
#      ansible-playbook playbooks/routeros_firmware.yml -e confirm_execution=true \
#        -l sec3.mno.memhamwan.net
#    (--check is NOT meaningful here — the upgrade is operational, not
#    declarative. A single deep leaf is the safe smoke test.)
#
# 1) Upgrade one active chain to the channel's latest:
#      ansible-playbook playbooks/routeros_firmware.yml -e confirm_execution=true \
#        -l mno
#
# 2) Upgrade the whole active domain (all mapped sites), latest:
#      ansible-playbook playbooks/routeros_firmware.yml -e confirm_execution=true \
#        -l sco:ftn:hil:mno
#
# 3) Pin an exact version and hard-verify every device ends on it:
#      ansible-playbook playbooks/routeros_firmware.yml -e confirm_execution=true \
#        -e routeros_target_version=7.24.1 -l sco:ftn:hil:mno
#
# 4) Force a version the channel is not serving (offline .npk, laid out under
#    <dir>/<architecture-name>/*.npk):
#      ansible-playbook playbooks/routeros_firmware.yml -e confirm_execution=true \
#        -e routeros_target_version=7.24.1 \
#        -e routeros_npk_source_dir=~/routeros-npks -l mno
#
# A crossing from v6 to v7 additionally needs -e routeros_allow_major_upgrade=true.
#
# TUNABLES FOR LOSSY LINKS (deep leaves like sec3.mno drop transfers):
#   -e routeros_download_attempts=6     # download retries per device (default 3)
#   -e routeros_download_timeout=1800   # seconds per attempt   (default 900)
#   -e routeros_connect_timeout=180     # SSH connect patience  (default 120)
# If downloads keep timing out on a device, it is almost always one of:
#   - no DNS on the box (`/ip dns print` empty) — fix DNS fleet-wide first
#     (routeros_baseline / site_services); or
#   - a link too thin to carry the download AND keep this control session
#     responsive (the status poll times out even though the download runs). For
#     those, download the package BY HAND on the device and let the playbook do
#     only the safe part (the ordered reboot):
#       # in a RouterOS terminal on the device:
#       /system package update set channel=stable
#       /system package update download        # watch it reach "Downloaded, please reboot"
#       # then, from here:
#       ansible-playbook playbooks/routeros_firmware.yml -e confirm_execution=true \
#         -l r2.hil.memhamwan.net -e routeros_prestaged=true
#     With routeros_prestaged=true the apply phase never downloads — it requires
#     the package already staged and goes straight to reboot + verify (and fails
#     with clear guidance if it isn't staged). Or stage the .npk offline
#     (routeros_npk_source_dir), which uploads from the controller instead.
#
# SAFETY NOTE: the CHECK play is all-or-nothing. If any in-scope device cannot
# be assessed (unreachable, no DNS, pinned target not offered, un-opted v6->v7),
# the run stops before APPLY touches anything. Fix that device or scope it out
# with -l, then re-run.

# ---------------------------------------------------------------------------
# Play 1 — PLAN: order the in-scope hosts deepest-first into _firmware_run.
# ---------------------------------------------------------------------------
- name: RouterOS firmware — plan the serial upgrade order
  hosts: 'routeros:!down'  # down group = known-dead devices, see inventory
  gather_facts: false
  tasks:
    - name: Execution gate — this play is a draft pending review
      ansible.builtin.assert:
        that: confirm_execution | default(false) | bool
        fail_msg: "DRAFT play. Pass -e confirm_execution=true only after PR review."
      run_once: true

    - name: Load the firmware topology (RoMON-derived ordering)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../firmware_topology.yml"
      run_once: true
      delegate_to: localhost

    # Refuse to upgrade any in-scope host whose place in the chains we do not
    # know — upgrading a device without knowing what is behind it is exactly the
    # outage this playbook exists to prevent.
    - name: Fail on any in-scope host missing from the topology
      ansible.builtin.assert:
        that: >-
          ansible_play_hosts_all
          | difference(firmware_topology.keys() | list)
          | length == 0
        fail_msg: >-
          These hosts have no firmware_topology entry (blast radius unknown):
          {{ ansible_play_hosts_all | difference(firmware_topology.keys() | list) | join(', ') }}.
          Map them from RoMON (see ansible/firmware_topology.yml) or scope the run
          with -l to a mapped chain (e.g. -l sco:ftn:hil:mno).
      run_once: true

    - name: Pair each in-scope host with its depth
      ansible.builtin.set_fact:
        _fw_pairs: >-
          {{ _fw_pairs | default([])
             + [{'host': item, 'depth': firmware_topology[item].fw_depth}] }}
      loop: "{{ ansible_play_hosts_all | sort }}"  # stable order within a depth
      run_once: true

    - name: Order hosts deepest-first (leaves before the core)
      ansible.builtin.set_fact:
        firmware_run_order: >-
          {{ (_fw_pairs | sort(attribute='depth') | map(attribute='host') | list) | reverse | list }}
      run_once: true

    - name: Show the planned upgrade order
      ansible.builtin.debug:
        msg: >-
          Serial upgrade order (deepest first, one at a time):
          {{ firmware_run_order }}
      run_once: true

    # add_host preserves this insertion order; the check/apply plays iterate it
    # with order: inventory. Existing inventory vars (network_cli, port 222,
    # etc.) come along because these are the same inventory hosts.
    - name: Register the ordered hosts into the run group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: _firmware_run
        ansible_user: "{{ lookup('env', 'USER') }}"
      loop: "{{ firmware_run_order }}"
      run_once: true
      changed_when: false

# ---------------------------------------------------------------------------
# Play 2 — CHECK: parallel, read-only. Assess every device, then prune the
# apply set to only the devices that actually need work (deepest-first order
# preserved) via the _firmware_apply group.
# ---------------------------------------------------------------------------
- name: RouterOS firmware — check versions (parallel, read-only)
  hosts: _firmware_run
  gather_facts: false
  any_errors_fatal: true  # a device we cannot assess halts the run before APPLY
  max_fail_percentage: 0
  vars:
    ansible_user: "{{ lookup('env', 'USER') }}"
    # Distant radio nodes (e.g. r1.hil, ~170ms + lossy) drop enough of the SSH
    # handshake that the default 30s persistent connect timeout fails where an
    # interactive ssh (which keeps retrying) gets through. Be patient on connect
    # and per-command. Override per run: -e routeros_connect_timeout=180
    ansible_connect_timeout: "{{ routeros_connect_timeout | default(120) }}"
    ansible_command_timeout: "{{ routeros_command_timeout | default(120) }}"
    _fw_phase: check
  pre_tasks:
    - name: Execution gate — this play is a draft pending review
      ansible.builtin.assert:
        that: confirm_execution | default(false) | bool
        fail_msg: "DRAFT play. Pass -e confirm_execution=true only after PR review."

    # libssh negotiates the ssh-rsa host key and cannot prompt on first contact;
    # without a pinned rsa entry it fails with an inscrutable "Host is unknown".
    - name: Preflight — look up pinned host key
      ansible.builtin.command: ssh-keygen -F "[{{ inventory_hostname }}]:{{ ansible_port | default(222) }}"
      register: hostkey_check
      changed_when: false
      failed_when: false
      delegate_to: localhost

    - name: Preflight — libssh needs a pinned ssh-rsa host key
      ansible.builtin.assert:
        that: "'ssh-rsa' in hostkey_check.stdout"
        fail_msg: >-
          No ssh-rsa host key for [{{ inventory_hostname }}]:{{ ansible_port | default(222) }}
          in ~/.ssh/known_hosts. Run `ansible-playbook playbooks/seed_known_hosts.yml`.

    # On a lossy link the network_cli connect can fail before it starts; poll the
    # SSH port from the controller first (tolerates loss — retries until it
    # answers) so we don't fail the run on a single dropped handshake.
    - name: Preflight — wait for the device SSH port to be reachable
      ansible.builtin.wait_for:
        host: "{{ inventory_hostname }}"
        port: "{{ ansible_port | default(222) }}"
        timeout: "{{ routeros_connect_timeout | default(120) }}"
      delegate_to: localhost
  roles:
    - routeros_firmware   # _fw_phase=check → read state + decide only, no reboot
  post_tasks:
    # Walk the deepest-first plan and keep only the devices the check phase
    # flagged as needing work. Iterate the _firmware_run GROUP (not the
    # firmware_run_order fact): the group is globally visible and add_host
    # preserved its deepest-first insertion order, so this is correct from
    # whichever host run_once lands on — the fact was set run_once in the PLAN
    # play and is not guaranteed present on this play's run_once host.
    - name: Select the devices that need the apply phase (deepest-first)
      ansible.builtin.set_fact:
        firmware_apply_order: "{{ firmware_apply_order | default([]) + [item] }}"
      loop: "{{ groups['_firmware_run'] }}"
      when: hostvars[item]._fw_needs_apply | default(false) | bool
      run_once: true

    - name: Register the devices needing work into the apply group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: _firmware_apply
        ansible_user: "{{ lookup('env', 'USER') }}"
      loop: "{{ firmware_apply_order | default([]) }}"
      run_once: true
      changed_when: false

    - name: Show the apply plan (and what is skipped as already-current)
      ansible.builtin.debug:
        msg: >-
          Apply phase (serial, deepest-first):
          {{ firmware_apply_order | default([]) | ternary(firmware_apply_order | default([]), 'nothing — all in-scope devices are already current') }}.
          Skipped (already current):
          {{ groups['_firmware_run'] | difference(firmware_apply_order | default([])) | list }}
      run_once: true

# ---------------------------------------------------------------------------
# Play 3 — APPLY: serial, one device at a time, deepest first. Only the devices
# the check phase found to need work are in _firmware_apply (empty = no-op run).
# ---------------------------------------------------------------------------
- name: RouterOS firmware — serial upgrade (deepest first)
  hosts: _firmware_apply
  gather_facts: false
  serial: 1               # one device at a time
  order: inventory        # follow the add_host insertion order (depth desc)
  any_errors_fatal: true  # a failed/mismatched device halts the whole campaign
  max_fail_percentage: 0
  vars:
    ansible_user: "{{ lookup('env', 'USER') }}"
    ansible_connect_timeout: "{{ routeros_connect_timeout | default(120) }}"
    ansible_command_timeout: "{{ routeros_command_timeout | default(120) }}"
    _fw_phase: apply
  pre_tasks:
    - name: Execution gate — this play is a draft pending review
      ansible.builtin.assert:
        that: confirm_execution | default(false) | bool
        fail_msg: "DRAFT play. Pass -e confirm_execution=true only after PR review."

    - name: Preflight — look up pinned host key
      ansible.builtin.command: ssh-keygen -F "[{{ inventory_hostname }}]:{{ ansible_port | default(222) }}"
      register: hostkey_check
      changed_when: false
      failed_when: false
      delegate_to: localhost

    - name: Preflight — libssh needs a pinned ssh-rsa host key
      ansible.builtin.assert:
        that: "'ssh-rsa' in hostkey_check.stdout"
        fail_msg: >-
          No ssh-rsa host key for [{{ inventory_hostname }}]:{{ ansible_port | default(222) }}
          in ~/.ssh/known_hosts. Run `ansible-playbook playbooks/seed_known_hosts.yml`.

    - name: Preflight — wait for the device SSH port to be reachable
      ansible.builtin.wait_for:
        host: "{{ inventory_hostname }}"
        port: "{{ ansible_port | default(222) }}"
        timeout: "{{ routeros_connect_timeout | default(120) }}"
      delegate_to: localhost
  roles:
    - routeros_firmware   # _fw_phase=apply → download/upload + reboot + verify
