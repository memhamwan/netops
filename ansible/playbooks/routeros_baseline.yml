---
# DRAFT — NEVER EXECUTED. Requires -e confirm_execution=true (review gate).
#
# Applies the routeros_baseline role over the RouterOS API as the dedicated
# `ansible` user (created by bootstrap_ansible_user.yml). API credentials come
# from sops — the operator's age key decrypts at run time; devices' API is
# ACL'd to the collector, so run from rpi.sco or pass api_extra_sources.
# First real run should be: --check --diff -e confirm_execution=true
- name: RouterOS fleet baseline
  hosts: routeros
  gather_facts: false
  vars:
    # play var, not the `connection:` keyword: the inventory's group-level
    # ansible_connection (network_cli) overrides play keywords, and the api
    # modules must run on the controller
    ansible_connection: local
  module_defaults:
    group/community.routeros.api:
      hostname: "{{ inventory_hostname }}"
      username: ansible
      password: "{{ routeros_svc_api_password }}"
      # api-ssl (per-device self-signed cert from onboard_device.yml):
      # encryption defeats passive capture; certificate validation waits on
      # the internal-CA step (role README) — hence validate_certs false
      tls: true
      port: 8729
      validate_certs: false
  pre_tasks:
    - name: Execution gate — this play is a draft pending review
      ansible.builtin.assert:
        that: confirm_execution | default(false) | bool
        fail_msg: "DRAFT play. Pass -e confirm_execution=true only after PR review."
      run_once: true

    # the api modules run on the controller (connection: local) and need
    # librouteros importable by the local python
    - name: Preflight — check for librouteros
      ansible.builtin.command: python3 -c "import librouteros"
      delegate_to: localhost
      run_once: true
      changed_when: false
      failed_when: false
      register: librouteros_check

    - name: Preflight — librouteros required on the controller
      ansible.builtin.assert:
        that: librouteros_check.rc == 0
        fail_msg: >-
          librouteros is not importable by the controller's python. Install it
          for the interpreter ansible discovers locally, e.g.
          `python3 -m pip install --user --break-system-packages librouteros`
          (homebrew pythons are PEP 668 externally-managed).
      run_once: true
    - name: Load secrets from sops
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../secrets/secrets.sops.yaml"
      run_once: true
      delegate_to: localhost
  roles:
    - routeros_baseline
