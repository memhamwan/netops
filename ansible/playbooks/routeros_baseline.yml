---
# Router-changing play: requires -e confirm_execution=true (review gate).
# Ran fleet-wide 2026-08-29/30 against the devices reachable then.
#
# Applies the routeros_baseline role over the RouterOS API as the dedicated
# `ansible` user (created by bootstrap_ansible_user.yml). API credentials come
# from sops — the operator's age key decrypts at run time. The API is
# allow-listed to management_sources_effective (inventory group_vars + the
# operators' addresses in sops); until a device carries that list, run from
# rpi.sco or tunnel through it.
# Start every change with: --check --diff -e confirm_execution=true
- name: Lifecycle — merge the private quarantine list (contacts no device)
  ansible.builtin.import_playbook: lifecycle.yml

- name: RouterOS fleet baseline
  hosts: 'routeros:!excluded:!expected_down:!quarantined'  # lifecycle groups: see inventory
  gather_facts: false
  vars:
    # play var, not the `connection:` keyword: the inventory's group-level
    # ansible_connection (network_cli) overrides play keywords, and the api
    # modules must run on the controller
    ansible_connection: local
    # run modules under the python that runs ansible (the project venv) —
    # never the interpreter discovery happens to find on the machine
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  module_defaults:
    group/community.routeros.api:
      hostname: "{{ inventory_hostname }}"
      username: ansible
      password: "{{ routeros_svc_api_password }}"
      # api-ssl (per-device self-signed cert from onboard_device.yml):
      # encryption defeats passive capture; certificate validation waits on
      # the internal-CA step (role README) — hence validate_certs false
      tls: true
      port: 8729
      validate_certs: false
  pre_tasks:
    - name: Execution gate — router changes need an explicit, reviewed run
      ansible.builtin.assert:
        that: confirm_execution | default(false) | bool
        fail_msg: "This play changes routers. Pass -e confirm_execution=true for a reviewed run."
      run_once: true

    # the api modules run on the controller (connection: local) and need
    # librouteros importable by the interpreter ansible discovers — which is
    # NOT necessarily `python3` on PATH (macs routinely have apple, homebrew,
    # and ansible-bundled pythons side by side). python_requirements_info
    # runs under the same discovered interpreter as the api modules and
    # reports its exact path for the error message.
    - name: Preflight — check for librouteros
      community.general.python_requirements_info:
        dependencies: [librouteros]
      delegate_to: localhost
      run_once: true
      register: librouteros_check

    - name: Preflight — librouteros required on the controller
      ansible.builtin.assert:
        that: "'librouteros' not in librouteros_check.not_found"
        fail_msg: >-
          librouteros is not importable by {{ librouteros_check.python }} —
          the interpreter ansible runs modules under. You're probably not in
          the project venv: `cd ansible && uv venv && uv pip install -r
          requirements.txt`, then rerun from a shell where direnv has put
          ansible/.venv/bin on PATH (see README).
      run_once: true
    - name: Load secrets from sops
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../secrets/secrets.sops.yaml"
      run_once: true
      delegate_to: localhost
  roles:
    - routeros_baseline
