---
# Router-changing play: requires -e confirm_execution=true (review gate).
# Ran fleet-wide 2026-08-29/30 against the devices reachable then.
#
# Converges devices to the declared config (roles/routeros_baseline/defaults,
# per-device host_vars) over the RouterOS API as the dedicated `ansible` user
# (created by bootstrap_ansible_user.yml). It REMOVES what is not declared:
# accounts, keys of removed accounts, schedulers, scripts, PPP, WireGuard,
# filter/nat/raw rules, regular files (copied off first) — so a device's
# legitimate extras must be in its host_vars before a real run there.
#   --check --diff                 drift report, changes nothing
#   -e confirm_execution=true      converge
# API credentials come from sops. The API is allow-listed to
# management_sources_effective (group_vars + operators' addresses in sops);
# until a device carries that list, run from rpi.sco or tunnel through it.
- name: RouterOS fleet baseline
  hosts: 'routeros:!excluded:!expected_down:!quarantined'  # lifecycle groups: see inventory
  gather_facts: false
  vars:
    # play var, not the `connection:` keyword: the inventory's group-level
    # ansible_connection (network_cli) overrides play keywords, and the api
    # modules must run on the controller
    ansible_connection: local
    # run modules under the python that runs ansible (the project venv) —
    # never the interpreter discovery happens to find on the machine
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  module_defaults:
    group/community.routeros.api:
      hostname: "{{ routeros_api_host | default(inventory_hostname) }}"
      username: ansible
      password: "{{ routeros_svc_api_password }}"
      # api-ssl (per-device self-signed cert from onboard_device.yml):
      # encryption defeats passive capture; certificate validation waits on
      # the internal-CA step (role README) — hence validate_certs false
      tls: true
      port: "{{ routeros_api_port | default(8729) }}"
      validate_certs: false
  pre_tasks:
    # --check only reads, so the drift report needs no flag
    - name: Execution gate — router changes need an explicit, reviewed run
      ansible.builtin.assert:
        that: ansible_check_mode or (confirm_execution | default(false) | bool)
        fail_msg: "This play changes routers. Pass -e confirm_execution=true for a reviewed run (or --check --diff for a drift report)."
      run_once: true

    # the api modules run on the controller (connection: local) and need
    # librouteros importable by the interpreter ansible discovers — which is
    # NOT necessarily `python3` on PATH (macs routinely have apple, homebrew,
    # and ansible-bundled pythons side by side). python_requirements_info
    # runs under the same discovered interpreter as the api modules and
    # reports its exact path for the error message.
    - name: Preflight — check for librouteros
      community.general.python_requirements_info:
        dependencies: [librouteros]
      delegate_to: localhost
      run_once: true
      register: librouteros_check

    - name: Preflight — librouteros required on the controller
      ansible.builtin.assert:
        that: "'librouteros' not in librouteros_check.not_found"
        fail_msg: >-
          librouteros is not importable by {{ librouteros_check.python }} —
          the interpreter ansible runs modules under. You're probably not in
          the project venv: `cd ansible && uv venv && uv pip install -r
          requirements.txt`, then rerun from a shell where direnv has put
          ansible/.venv/bin on PATH (see README).
      run_once: true
    - name: Load secrets from sops
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../secrets/secrets.sops.yaml"
      run_once: true
      delegate_to: localhost
      when: routeros_svc_api_password is not defined
    # every allow list includes the operators' addresses; without them the
    # run would stop at services.yml, after the cleanup had already run
    - name: Preflight — operators' management addresses loaded
      ansible.builtin.assert:
        that:
          - management_sources_private is defined
          - management_sources_private | length > 0
        fail_msg: >-
          management_sources_private is not set. It comes from sops, which is
          skipped when routeros_svc_api_password is passed with -e: pass
          management_sources_private with -e as well, or let sops load.
      run_once: true
  roles:
    - routeros_baseline
