---
# CI/local check: render every backup_host template against the real inventory
# (dummy secrets), so template errors are caught before a deploy — this is the
# check that catches things like a label referenced by alerts but never
# emitted. Output lands in ansible/build/rendered/ (gitignored); CI then runs
# the real validators (promtool, alloy fmt, YAML parse) over it.
- name: Render all templates for validation
  hosts: localhost
  gather_facts: false
  vars:
    render_dir: "{{ playbook_dir }}/../build/rendered"
    mktxp_password: dummy
    caddy_basicauth_user: dummy
    caddy_basicauth_hash: dummy
  tasks:
    - name: Load backup_host defaults (templates reference role vars)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/backup_host/defaults/main.yml"

    - name: Render directory
      ansible.builtin.file:
        path: "{{ render_dir }}"
        state: directory
        mode: "0755"

    - name: Render templates
      ansible.builtin.template:
        src: "../roles/backup_host/templates/{{ item }}.j2"
        dest: "{{ render_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - router.db
        - icmp-routeros.yml
        - icmp-infra.yml
        - dns-services.yml
        - mktxp.conf
        - caddy-auth.snippet
        - config.alloy
        - netops-firewall.sh

    - name: Rendered target files parse as YAML lists
      ansible.builtin.assert:
        that: lookup('file', render_dir ~ '/' ~ item) | from_yaml | length > 0
        quiet: true
      loop:
        - icmp-routeros.yml
        - icmp-infra.yml
        - dns-services.yml

# Same idea for site_services: render against the real service host's vars so
# the zone data, frr config, and health script are proven to template. Runs
# with connection: local — nothing is sent to the host.
- name: Render site_services templates for validation
  hosts: service_hosts
  connection: local
  gather_facts: false
  become: false
  vars:
    render_dir: "{{ playbook_dir }}/../build/rendered/site-services"
    ospf_md5_key: dummy-key-for-render
  tasks:
    - name: Load site_services defaults + extra DNS records
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ playbook_dir }}/../roles/site_services/defaults/main.yml"
        - "{{ playbook_dir }}/../inventory/dns_extra_records.yml"

    # After include_vars, which outranks play vars: render the anycast-enabled
    # variant, since it is the superset (frr config exists only in that state).
    - name: Render the anycast-enabled variant
      ansible.builtin.set_fact:
        anycast_enabled: true

    - name: Render directory
      ansible.builtin.file:
        path: "{{ render_dir }}"
        state: directory
        mode: "0755"

    - name: Render templates
      ansible.builtin.template:
        src: "../roles/site_services/templates/{{ item.src }}.j2"
        dest: "{{ render_dir }}/{{ item.dest | default(item.src) }}"
        mode: "0644"
      loop:
        - {src: unbound-netops.conf}
        - {src: unbound-local-zone.conf}
        - {src: chrony.conf}
        - {src: frr.conf}
        - {src: netops-anycast-link.service}
        - {src: anycast-health.sh}

    - name: The rendered zone data covers the fleet and the extra records
      ansible.builtin.assert:
        # Literal substring checks (`in`), not `is search` — `search` is a
        # regex, where every unescaped `.` is a wildcard, so a pattern like
        # 'ntp.memhamwan.net. 300 IN A ...' also matches 'ntpXmemhamwanYnetZ
        # 300 IN A ...'. These assertions exist to catch exactly that kind of
        # corruption, so they have to match exactly.
        that:
          - "'local-data: \"r1.sco.memhamwan.net. 300 IN A 44.34.128.33\"' in zone_text"
          - "'local-data-ptr: \"44.34.128.45 rpi.sco.memhamwan.net\"' in zone_text"
          # service names follow the .132/.133 pair convention for both
          # services; 44.34.128.181 keeps only its legacy per-host name
          - "'local-data: \"dns.memhamwan.net. 300 IN A 44.34.132.1\"' in zone_text"
          - "'local-data: \"dns2.memhamwan.net. 300 IN A 44.34.133.1\"' in zone_text"
          - "'local-data: \"ntp.memhamwan.net. 300 IN A 44.34.132.3\"' in zone_text"
          - "'local-data: \"ntp2.memhamwan.net. 300 IN A 44.34.133.3\"' in zone_text"
          - "'local-data: \"ntp.leb.memhamwan.net. 300 IN A 44.34.128.181\"' in zone_text"
          # the health-probe sentinel must be present with the value the probe
          # expects, or the DNS liveness check withdraws on a name it can't resolve
          - "'local-data: \"dns-probe.memhamwan.net. 300 IN A 192.0.2.53\"' in zone_text"
        quiet: true
      vars:
        zone_text: "{{ lookup('file', render_dir ~ '/unbound-local-zone.conf') }}"

    # The M1 guarantee, asserted rather than assumed: with anycast off the
    # script cannot touch an address, and with it on it can.
    - name: The health script honours the anycast switch in both directions
      ansible.builtin.assert:
        that:
          - "'ANYCAST_ENABLED=0' in disabled_script"
          - "'ANYCAST_ENABLED=1' in enabled_script"
          - "'44.34.132.1 44.34.133.1' in enabled_script"
        quiet: true
      vars:
        script: ../roles/site_services/templates/anycast-health.sh.j2
        disabled_script: "{{ lookup('template', script, template_vars={'anycast_enabled': false}) }}"
        enabled_script: "{{ lookup('template', script, template_vars={'anycast_enabled': true}) }}"

    # frr must never redistribute anything beyond the service /32s, and must
    # never win a DR election on the site LAN.
    - name: The frr config keeps its guardrails
      ansible.builtin.assert:
        # literal, for the same reason as the zone assertions above
        that:
          - "'ip ospf priority 0' in frr_text"
          - "'redistribute connected metric-type 1 route-map ANYCAST-ONLY' in frr_text"
          - "'no default-information originate' in frr_text"
          - "'route-map ANYCAST-ONLY deny 20' in frr_text"
          # deny follows the last service permit: 7 services (dns×2, ntp×3,
          # authdns×2) → permits at seq 5..35, deny any at seq 40
          - "'ip prefix-list ANYCAST-SERVICES seq 40 deny any' in frr_text"
          # the authdns /32s ride the same prefix-list (announced only when
          # NSD is enabled AND healthy — the health script gates the address)
          - "'ANYCAST-SERVICES seq 30 permit 44.34.132.53/32' in frr_text"
          - "'ANYCAST-SERVICES seq 35 permit 44.34.133.53/32' in frr_text"
        quiet: true
      vars:
        frr_text: "{{ lookup('file', render_dir ~ '/frr.conf') }}"

    # The open-resolver guard, asserted rather than assumed. With public auth
    # on (the default, rendered above) the 0.0.0.0/0 face must be
    # refuse_non_local — serve authoritative local-data, never recurse — and
    # must NEVER be `allow`, which would be an open resolver. Recursion is
    # fleet reach only, never all of 44/8.
    - name: unbound never exposes recursion to the public (public auth on)
      ansible.builtin.assert:
        that:
          - "'access-control: 0.0.0.0/0 refuse_non_local' in acl"
          - "'access-control: 0.0.0.0/0 allow' not in acl"
          - "'ip-ratelimit:' in acl"
          - "'access-control: 44.34.128.0/21 allow' in acl"
          - "'access-control: 44.0.0.0/8 allow' not in acl"
          # NSD off: nothing on this host is an upstream, so localhost stays off
          - "'do-not-query-localhost: yes' in acl"
        quiet: true
      vars:
        acl: "{{ lookup('file', render_dir ~ '/unbound-netops.conf') }}"

    # set_fact (not template_vars/task-vars) so it outranks the include_vars
    # default; render the other switch position and pin it too, so a future
    # edit that widens the public face fails CI instead of shipping.
    - name: Flip public auth off for the second render
      ansible.builtin.set_fact:
        dns_authoritative_public: false

    - name: Render unbound with public auth off
      ansible.builtin.template:
        src: ../roles/site_services/templates/unbound-netops.conf.j2
        dest: "{{ render_dir }}/unbound-netops.conf.public-off"
        mode: "0644"

    - name: With public auth off the internal zone stays fleet-only
      ansible.builtin.assert:
        that:
          # full directive, not a bare 'refuse_non_local' — that substring
          # also appears in the explanatory comment block above the rule.
          - "'access-control: 0.0.0.0/0 refuse' in acl_off"
          - "'access-control: 0.0.0.0/0 refuse_non_local' not in acl_off"
          - "'access-control: 0.0.0.0/0 allow' not in acl_off"
        quiet: true
      vars:
        acl_off: "{{ lookup('file', render_dir ~ '/unbound-netops.conf.public-off') }}"

    # ── Authoritative NSD variant ──────────────────────────────────────────
    # Render the nsd_enabled superset last (it adds the NSD config, the
    # inventory-rendered authoritative zonefiles, unbound's stub-zone, and
    # unbound's explicit-bind mode), so a template error or a broken guarantee
    # fails CI instead of shipping. set_fact outranks the include_vars default.
    - name: Render the NSD-enabled variant
      ansible.builtin.set_fact:
        nsd_enabled: true

    - name: Render NSD, zone, stub, and the NSD-mode unbound config
      ansible.builtin.template:
        src: "../roles/site_services/templates/{{ item.src }}.j2"
        dest: "{{ render_dir }}/{{ item.dest }}"
        mode: "0644"
      loop:
        - {src: nsd.conf, dest: nsd.conf}
        - {src: nsd-zone-forward, dest: memhamwan.net.zone}
        - {src: unbound-stub.conf, dest: unbound-stub.conf}
        - {src: unbound-netops.conf, dest: unbound-netops.conf.nsd-on}
        - {src: anycast-health.sh, dest: anycast-health.sh.nsd-on}

    - name: Render one reverse zone (the .128 /24)
      ansible.builtin.template:
        src: ../roles/site_services/templates/nsd-zone-reverse.j2
        dest: "{{ render_dir }}/128.34.44.in-addr.arpa.zone"
        mode: "0644"
      vars:
        reverse_zone: 128.34.44.in-addr.arpa

    - name: The authoritative forward zone carries SOA, NS/glue, fleet, and service records
      ansible.builtin.assert:
        # literal substrings, for the same regex reason as the assertions above
        that:
          - "'IN SOA ns1.memhamwan.net. hostmaster.memhamwan.net.' in fwd"
          - "'@ IN NS ns1.memhamwan.net.' in fwd"
          - "'ns1 IN A 44.34.132.53' in fwd"
          - "'ns2 IN A 44.34.133.53' in fwd"
          - "'r1.sco.memhamwan.net. IN A 44.34.128.33' in fwd"
          - "'dns-probe.memhamwan.net. 300 IN A 192.0.2.53' in fwd"
          # a down host (leb.sco is in groups['down']) must not be published
          - "'leb.sco.memhamwan.net. IN A' not in fwd"
        quiet: true
      vars:
        fwd: "{{ lookup('file', render_dir ~ '/memhamwan.net.zone') }}"

    - name: The reverse zone carries PTRs for its own /24 only
      ansible.builtin.assert:
        that:
          - "'45 IN PTR rpi.sco.memhamwan.net.' in rev"
          - "'33 IN PTR r1.sco.memhamwan.net.' in rev"
          # leb.sco (44.34.128.40) is down — no PTR either
          - "'40 IN PTR leb.sco.memhamwan.net.' not in rev"
        quiet: true
      vars:
        rev: "{{ lookup('file', render_dir ~ '/128.34.44.in-addr.arpa.zone') }}"

    - name: NSD owns the authdns IPs, and unbound no longer wildcard-grabs them
      ansible.builtin.assert:
        that:
          # NSD binds the authdns anycast pair + the loopback stub listener
          - "'ip-address: 127.0.0.1@5353' in nsdconf"
          - "'ip-address: 44.34.132.53' in nsdconf"
          - "'ip-address: 44.34.133.53' in nsdconf"
          # unbound, in NSD mode, binds the recursive anycast /32s explicitly
          # and NEVER the authdns /32s, and drops the wildcard
          - "'interface: 44.34.132.1' in ubnsd"
          - "'interface: 44.34.132.53' not in ubnsd"
          - "'interface-automatic: yes' not in ubnsd"
          # on-net recursion of the internal zone goes to the local NSD
          - "'stub-addr: 127.0.0.1@5353' in stub"
          # and unbound must be ALLOWED to query that localhost target, or the
          # stub silently SERVFAILs the whole internal zone
          - "'do-not-query-localhost: no' in ubnsd"
        quiet: true
      vars:
        nsdconf: "{{ lookup('file', render_dir ~ '/nsd.conf') }}"
        ubnsd: "{{ lookup('file', render_dir ~ '/unbound-netops.conf.nsd-on') }}"
        stub: "{{ lookup('file', render_dir ~ '/unbound-stub.conf') }}"

    - name: In NSD mode the health script gates and announces the authdns /32s
      ansible.builtin.assert:
        that:
          - "'ZONE_FILE=/etc/nsd/zones/memhamwan.net.zone' in hs"
          - "'AUTHDNS_IPS=\"44.34.132.53 44.34.133.53\"' in hs"
          # health-gated exactly like dns/ntp, and folded into the reconcile set
          - "'announce \"$_ip\" \"$authdns_healthy\"' in hs"
          - "'$DNS_IPS $NTP_IPS $AUTHDNS_IPS' in hs"
        quiet: true
      vars:
        hs: "{{ lookup('file', render_dir ~ '/anycast-health.sh.nsd-on') }}"

# Same idea for linux_baseline: render its templates so a template error or
# unresolved var is caught in CI — the high-risk SSH config especially must not
# escape validation. Rendered against a real service host.
- name: Render linux_baseline templates for validation
  hosts: service_hosts
  connection: local
  gather_facts: false
  become: false
  vars:
    render_dir: "{{ playbook_dir }}/../build/rendered/linux-baseline"
  tasks:
    # include_vars outranks inventory, so capture the inventory node-exporter
    # bind override first and reapply it after, or the render would test the
    # default expression instead of the deployed 172.17.0.1:9100.
    - name: Preserve inventory node-exporter bind override
      ansible.builtin.set_fact:
        ci_ne_listen: "{{ linux_baseline_node_exporter_listen | default('') }}"

    - name: Load linux_baseline defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/linux_baseline/defaults/main.yml"

    - name: Reapply inventory node-exporter bind override
      ansible.builtin.set_fact:
        linux_baseline_node_exporter_listen: "{{ ci_ne_listen }}"
      when: ci_ne_listen | length > 0

    - name: Render directory
      ansible.builtin.file:
        path: "{{ render_dir }}"
        state: directory
        mode: "0755"

    - name: Render templates
      ansible.builtin.template:
        src: "../roles/linux_baseline/templates/{{ item }}"
        dest: "{{ render_dir }}/{{ item | basename | regex_replace('[.]j2$', '') }}"
        mode: "0644"
      loop:
        - ssh/10-netops-ports.conf.j2
        - ssh/20-hardening.conf.j2
        - resolv.conf.j2
        - chrony-client.conf.j2
        - 52unattended-upgrades-local.j2
        - prometheus-node-exporter.default.j2
        - sudoers-operators.j2

    - name: The rendered sshd drop-ins carry the configured port + login group
      ansible.builtin.assert:
        that:
          - "'Port 222' in ports_text"
          - "'AllowGroups sshusers' in hardening_text"
          - "'PasswordAuthentication no' in hardening_text"
        quiet: true
      vars:
        ports_text: "{{ lookup('file', render_dir ~ '/10-netops-ports.conf') }}"
        hardening_text: "{{ lookup('file', render_dir ~ '/20-hardening.conf') }}"
