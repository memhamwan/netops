---
# Single source of truth for the MemHamWAN fleet.
# router.db, the ICMP probe targets, mktxp.conf, and the alloy config are
# RENDERED from this file by the backup_host role at deploy time (and by
# ansible/playbooks/ci_render.yml in CI) — edit here, not there.
# `ip` feeds the ICMP probe targets (so monitoring doesn't depend on DNS) and
# is the intended feed for future DNS management; hosts without one are
# probed by hostname.
all:
  children:
    routeros:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: community.routeros.routeros
        ansible_port: 222
      children:
        atl:
          hosts:
            er1.atl.memhamwan.net: {ip: 44.34.129.209}
        azo:
          hosts:
            leb.azo.memhamwan.net: {}
            omn2.azo.memhamwan.net: {}
            r1.azo.memhamwan.net: {}
            r2.azo.memhamwan.net: {}
            r3.azo.memhamwan.net: {}
            r4.azo.memhamwan.net: {}
        ftn:
          hosts:
            r1.ftn.memhamwan.net: {ip: 44.34.129.194}
            sco.ftn.memhamwan.net: {ip: 44.34.129.195}
        hil:
          hosts:
            mno.hil.memhamwan.net: {ip: 44.34.128.110}
            r1.hil.memhamwan.net: {ip: 44.34.128.103}
            r2.hil.memhamwan.net: {ip: 44.34.128.107}
            sco.hil.memhamwan.net: {ip: 44.34.128.97}  # the re-aimed ex-leb.hil dish (same hardware, serial-verified)
        leb:
          hosts:
            ap.leb.memhamwan.net: {ip: 44.34.128.188}
            crw.leb.memhamwan.net: {ip: 44.34.128.168}
            hil.leb.memhamwan.net: {ip: 44.34.128.175}
            mno.leb.memhamwan.net: {ip: 44.34.128.182}
            r1.leb.memhamwan.net: {ip: 44.34.128.161}
            ret.leb.memhamwan.net: {ip: 44.34.128.176}
            sco.leb.memhamwan.net: {ip: 44.34.128.173}
        mch:
          hosts:
            r1.mch.memhamwan.net: {}
        mno:
          hosts:
            ap1.mno.memhamwan.net: {ip: 44.34.129.49}
            hil.mno.memhamwan.net: {ip: 44.34.129.38}
            leb.mno.memhamwan.net: {ip: 44.34.129.39}
            r1.mno.memhamwan.net: {ip: 44.34.129.34}
            r2.mno.memhamwan.net: {ip: 44.34.129.35}
            sec3.mno.memhamwan.net: {ip: 44.34.129.42}
        ret:
          hosts:
            leb.ret.memhamwan.net: {ip: 44.34.129.161}
        sco:
          hosts:
            ftn.sco.memhamwan.net: {ip: 44.34.128.43}
            hil.sco.memhamwan.net: {ip: 44.34.128.35}
            leb.sco.memhamwan.net: {ip: 44.34.128.40}
            lte.sco.memhamwan.net: {ip: 44.34.128.38}
            r1.sco.memhamwan.net: {ip: 44.34.128.33}
            r2.sco.memhamwan.net: {ip: 44.34.128.41}
            sec1.sco.memhamwan.net: {ip: 44.34.128.34}
            sec3.sco.memhamwan.net: {ip: 44.34.128.36}
    # Devices known down/not deployed: kept in their site groups as IPAM
    # record, but excluded from rendered configs (oxidized, ICMP probes,
    # mktxp), from the device plays (hosts: 'routeros:!down'), and from any
    # future DNS publishing driven by this inventory. Move a host out of this
    # group when it comes back, then redeploy the backup host.
    down:
      hosts:
        leb.sco.memhamwan.net: {}  # site device down
        lte.sco.memhamwan.net: {}  # built 2026-08-28, never deployed (LTE modem band mismatch)
    ups:
      hosts:
        ups.azo.memhamwan.net: {site: azo}
        ups.leb.memhamwan.net: {site: leb}
        ups.mno.memhamwan.net: {site: mno}
        ups.sco.memhamwan.net: {site: sco}
    backup_hosts:
      hosts:
        rpi.sco.memhamwan.net:
          ip: 44.34.128.45
          site: sco
          ansible_port: 222  # network-wide SSH convention; sshd drop-in via linux_baseline
      vars:
        # Native node-exporter binds the docker-bridge gateway so it stays off
        # the public LAN and the containerised Prometheus scrapes it locally.
        linux_baseline_node_exporter_listen: "172.17.0.1:9100"
    # Hosts running the site_services role (recursive+internal DNS, NTP, and —
    # once enabled — the anycast announcements). rpi.sco is also the backup
    # host; a second host at HIL is the next one to onboard (M3).
    service_hosts:
      hosts:
        rpi.sco.memhamwan.net:
          # LAN interface that speaks OSPF to the site routers (frr, M2+)
          site_lan_interface: eth0
        # HIL service Pi (also the meshtastic host). A Linux box, so it lives
        # here (ssh connection) — NOT in the routeros `hil` site group. ip gives
        # it a DNS A/PTR record + node-exporter target; site_lan_interface (eth0,
        # 44.34.128.96/28, peers r1.hil/r2.hil) is for M2 anycast.
        rpi.hil.memhamwan.net:
          ip: 44.34.128.108
          # Connect by IP: this host's DNS name is brand-new (this deploy is what
          # publishes it, in the fleet resolver the controller doesn't use), so
          # the inventory name won't resolve on the workstation yet.
          ansible_host: 44.34.128.108
          site: hil
          site_lan_interface: eth0
          ansible_port: 222   # after linux_baseline installs the sshd drop-in
      vars:
        # These hosts RUN unbound + chrony, so the linux_baseline DNS/NTP
        # client yields to site_services (which owns resolv.conf + chrony).
        linux_baseline_manage_resolver: false
        linux_baseline_manage_ntp_client: false
