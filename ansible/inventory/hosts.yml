---
# Single source of truth for the MemHamWAN fleet.
# router.db, the ICMP probe targets, mktxp.conf, and the alloy config are
# RENDERED from this file by the netops_host role at deploy time (and by
# ansible/playbooks/ci_render.yml in CI) — edit here, not there.
# `ip` feeds the ICMP probe targets (so monitoring doesn't depend on DNS) and
# is the intended feed for future DNS management; hosts without one are
# probed by hostname.
all:
  children:
    routeros:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: community.routeros.routeros
        ansible_port: 222
      children:
        atl:
          hosts:
            er1.atl.memhamwan.net: {ip: 44.34.129.209}
        azo:
          hosts:
            leb.azo.memhamwan.net: {ip: 44.34.129.68}
            omn2.azo.memhamwan.net: {ip: 44.34.129.67}
            r1.azo.memhamwan.net: {ip: 44.34.129.66}
            r2.azo.memhamwan.net: {ip: 44.34.129.73}
            r3.azo.memhamwan.net: {ip: 44.34.129.74}
            r4.azo.memhamwan.net: {ip: 44.34.129.75}
        ftn:
          hosts:
            r1.ftn.memhamwan.net: {ip: 44.34.129.194}
            sco.ftn.memhamwan.net: {ip: 44.34.129.195}
        hil:
          hosts:
            mno.hil.memhamwan.net: {ip: 44.34.128.110}
            r1.hil.memhamwan.net: {ip: 44.34.128.103}
            r2.hil.memhamwan.net: {ip: 44.34.128.107}
            sco.hil.memhamwan.net: {ip: 44.34.128.97}  # the re-aimed ex-leb.hil dish (same hardware, serial-verified)
        leb:
          hosts:
            ap.leb.memhamwan.net: {ip: 44.34.128.188}
            crw.leb.memhamwan.net: {ip: 44.34.128.168}
            hil.leb.memhamwan.net: {ip: 44.34.128.175}
            mno.leb.memhamwan.net: {ip: 44.34.128.182}
            r1.leb.memhamwan.net: {ip: 44.34.128.161}
            ret.leb.memhamwan.net: {ip: 44.34.128.176}
            sco.leb.memhamwan.net: {ip: 44.34.128.173}
        mch:
          hosts:
            r1.mch.memhamwan.net: {ip: 44.34.130.49}
        mno:
          hosts:
            ap1.mno.memhamwan.net: {ip: 44.34.129.49}
            hil.mno.memhamwan.net: {ip: 44.34.129.38}
            leb.mno.memhamwan.net: {ip: 44.34.129.39}
            r1.mno.memhamwan.net: {ip: 44.34.129.34}
            r2.mno.memhamwan.net: {ip: 44.34.129.35}
            sec3.mno.memhamwan.net: {ip: 44.34.129.42}
        ret:
          hosts:
            leb.ret.memhamwan.net: {ip: 44.34.129.161}
        sco:
          hosts:
            ftn.sco.memhamwan.net: {ip: 44.34.128.43}
            hil.sco.memhamwan.net: {ip: 44.34.128.35}
            leb.sco.memhamwan.net: {ip: 44.34.128.40}  # device alive on copper (2026-09-06); only its RF peer site (LEB) is dark
            lte.sco.memhamwan.net: {ip: 44.34.128.38}
            r1.sco.memhamwan.net: {ip: 44.34.128.33}
            r2.sco.memhamwan.net: {ip: 44.34.128.41}
            sec1.sco.memhamwan.net: {ip: 44.34.128.34}
            sec3.sco.memhamwan.net: {ip: 44.34.128.36}
    # ── Two lifecycle groups, distinct on purpose ─────────────────────────
    # excluded: hosts that cannot meaningfully be monitored at all (never
    # deployed, or no known address). Kept in their site groups as IPAM
    # record, but dropped from every rendered consumer: ICMP probes, oxidized,
    # mktxp, the device plays, and future DNS publishing.
    #
    # expected_down: hosts that are real and addressable but known dead (dark
    # site, dead hardware). They STAY in the ICMP probe targets — stamped with
    # an `expected: down` label so reachability alerts skip them and their
    # availability history keeps recording (the day one answers again, its
    # graph goes green) — but are dropped from oxidized/mktxp/device plays,
    # which cannot reach them anyway.
    #
    # Moving a host in or out of either group takes a backup-host redeploy to
    # apply. Date the reason comment when you move one.
    excluded:
      hosts:
        lte.sco.memhamwan.net: {}  # built 2026-08-28, never deployed (LTE modem band mismatch)
        ups.sco.memhamwan.net: {}  # 2026-09-06: no known address, no DNS, no ARP/lease/config trace at SCO — determine on site visit whether a management card even exists
    expected_down:
      hosts:
        # LEB site dark (predates monitoring, 2026-09-06 census)
        ap.leb.memhamwan.net: {}
        crw.leb.memhamwan.net: {}
        hil.leb.memhamwan.net: {}
        mno.leb.memhamwan.net: {}
        r1.leb.memhamwan.net: {}
        ret.leb.memhamwan.net: {}
        sco.leb.memhamwan.net: {}
        # AZO site dark (predates monitoring, 2026-09-06 census)
        leb.azo.memhamwan.net: {}
        omn2.azo.memhamwan.net: {}
        r1.azo.memhamwan.net: {}
        r2.azo.memhamwan.net: {}
        r3.azo.memhamwan.net: {}
        r4.azo.memhamwan.net: {}
        # single-device dark sites (2026-09-06 census)
        r1.mch.memhamwan.net: {}
        leb.ret.memhamwan.net: {}
        # dead device at a live site (2026-09-06 census)
        ap1.mno.memhamwan.net: {}
        # UPSes: never answered a probe in monitoring history (2026-09-06
        # census). azo/leb are masked by their dark sites; mno's APC card is
        # dead on the wire — power-cycle it on the next site visit.
        ups.azo.memhamwan.net: {}
        ups.leb.memhamwan.net: {}
        ups.mno.memhamwan.net: {}
    ups:
      hosts:
        ups.azo.memhamwan.net: {site: azo, ip: 44.34.129.77}
        ups.leb.memhamwan.net: {site: leb, ip: 44.34.128.189}
        # ip from r1.mno's static ARP (MAC 00:C0:B7:6D:F5:C5, APC OUI) —
        # verified 2026-09-06; the card itself is not answering
        ups.mno.memhamwan.net: {site: mno, ip: 44.34.129.50}
        ups.sco.memhamwan.net: {site: sco}
    netops_hosts:
      hosts:
        rpi.sco.memhamwan.net:
          ip: 44.34.128.45
          site: sco
          ansible_port: 222  # network-wide SSH convention; sshd drop-in via linux_baseline
      vars:
        # Native node-exporter binds the docker-bridge gateway so it stays off
        # the public LAN and the containerised Prometheus scrapes it locally.
        linux_baseline_node_exporter_listen: "172.17.0.1:9100"
    # Hosts running the site_services role (recursive+internal DNS, NTP, and —
    # once enabled — the anycast announcements). rpi.sco is also the backup
    # host; a second host at HIL is the next one to onboard (M3).
    service_hosts:
      hosts:
        rpi.sco.memhamwan.net:
          # LAN interface that speaks OSPF to the site routers (frr, M2+)
          site_lan_interface: eth0
        # The HIL meshtastic Pi, now also a service host. A Linux box, so it
        # lives here (ssh connection) — NOT in the routeros `hil` site group.
        # Named meshtastic.hil to match the box + its existing Cloudflare record
        # (so the name resolves for ansible). ip gives it a DNS A/PTR + node
        # target; site_lan_interface (eth0, 44.34.128.96/28, peers r1.hil/r2.hil)
        # is for M2 anycast.
        meshtastic.hil.memhamwan.net:
          ip: 44.34.128.108
          site: hil
          site_lan_interface: eth0
          ansible_port: 222   # after linux_baseline installs the sshd drop-in
      vars:
        # These hosts RUN unbound + chrony, so the linux_baseline DNS/NTP
        # client yields to site_services (which owns resolv.conf + chrony).
        linux_baseline_manage_resolver: false
        linux_baseline_manage_ntp_client: false
