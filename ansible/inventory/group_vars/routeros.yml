---
# Declared state shared by every RouterOS device. Design:
# docs/routeros-convergence-design.md. Per-device exceptions belong in
# host_vars/<host>.yml.

# Sources allowed to reach the management services (SSH, API-SSL). Only the
# netops host is listed here; operators' addresses are personal, so they live
# in sops as `management_sources_private` and are merged at run time by the
# routeros_lifecycle role, which stops the run if they are missing. One list
# feeds every management allow list.
management_sources:
  - 44.34.128.45/32  # rpi.sco: mktxp, Oxidized, the scheduled audit

# Undefined until routeros_lifecycle has run, on purpose: nothing may write an
# allow list that lacks the operators' addresses.
management_sources_effective: "{{ (management_sources + management_sources_private) | unique }}"
