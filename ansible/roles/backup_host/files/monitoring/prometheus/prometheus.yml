global:
  scrape_interval: 60s
  evaluation_interval: 60s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: node
    static_configs:
      # node-exporter binds the docker bridge address only
      - targets: [host.docker.internal:9100]
        labels:
          site: sco
          device: rpi.sco

  # RouterOS API metrics for the whole fleet via mktxp (one endpoint)
  - job_name: mktxp
    scrape_interval: 60s
    scrape_timeout: 50s
    static_configs:
      - targets: [mktxp:49090]

  # ICMP reachability of every RouterOS device (and UPSes). Targets are
  # rendered from the inventory: the recorded IP when there is one (monitoring
  # must not depend on DNS), hostname otherwise. `device` carries the short
  # hostname for alerts/dashboards (see targets/*.yml).
  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files: [/etc/prometheus/targets/icmp-*.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # HTTP checks of our own services
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: [/etc/prometheus/targets/http-*.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
