# Images are pinned to the versions verified in production; bump deliberately,
# not via a surprise :latest pull.
services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      - --web.external-url=https://prometheus.memhamwan.net
    volumes:
      - /var/lib/netops/monitoring/prometheus:/etc/prometheus:ro
      - /var/lib/netops/prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.34.0
    container_name: alertmanager
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=https://alertmanager.memhamwan.net
    volumes:
      - /var/lib/netops/monitoring/alertmanager:/etc/alertmanager:ro
      - /var/lib/netops/secrets/discord-webhook-url:/run/secrets/discord-webhook-url:ro
      - /var/lib/netops/alertmanager:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  blackbox:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    container_name: blackbox
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    cap_add:
      - NET_RAW
    volumes:
      - /var/lib/netops/monitoring/blackbox:/etc/blackbox_exporter:ro

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /etc/grafana/secrets/grafana-admin-password
      GF_SERVER_ROOT_URL: https://grafana.memhamwan.net
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # hams get read-only dashboards without an account
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - /var/lib/netops/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - /var/lib/netops/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - /var/lib/netops/secrets/grafana-admin-password:/etc/grafana/secrets/grafana-admin-password:ro
      - /var/lib/netops/grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2.11.4
    container_name: caddy
    restart: unless-stopped
    volumes:
      - /var/lib/netops/monitoring/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/netops/secrets/caddy-auth.snippet:/run/secrets/caddy-auth.snippet:ro
      - /var/lib/netops/caddy/data:/data
      - /var/lib/netops/caddy/config:/config
    ports:
      # public HamWAN/internet-facing entrypoint
      - "44.34.128.45:80:80"
      - "44.34.128.45:443:443"

  loki:
    image: grafana/loki:3.7.7
    container_name: loki
    restart: unless-stopped
    user: "10001:10001"
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - /var/lib/netops/monitoring/loki:/etc/loki:ro
      - /var/lib/netops/loki:/loki

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      # readiness on the compose network so blackbox can probe it (a crashed
      # alloy would otherwise stop log collection with loki still "ready");
      # not published to the host
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - /var/lib/netops/monitoring/alloy:/etc/alloy:ro
      - /var/lib/netops/alloy:/var/lib/alloy/data
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    ports:
      # device syslog arrives on the HamWAN address
      - "44.34.128.45:514:514/udp"
      - "44.34.128.45:514:514"

  mktxp:
    image: ghcr.io/akpw/mktxp:1.2.20
    container_name: mktxp
    restart: unless-stopped
    user: root
    volumes:
      # mktxp.conf is rendered by the backup_host role from inventory + sops
      # (holds the API password); _mktxp.conf is installed alongside it
      - /var/lib/netops/mktxp:/etc/mktxp

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      # docker-bridge only: containers scrape via host.docker.internal;
      # not exposed on the HamWAN LAN
      - --web.listen-address=172.17.0.1:9100
      - --path.rootfs=/host
      # backup/oxidized freshness metrics written by /opt/netops scripts
      - --collector.textfile.directory=/host/var/lib/netops/node-exporter
    volumes:
      - /:/host:ro,rslave
