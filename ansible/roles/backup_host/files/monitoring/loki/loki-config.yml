auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

limits_config:
  # 30 days; revisit once real volume/SD wear is known
  retention_period: 720h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # syslog is unauthenticated: a sender spoofing an allowlisted hostname can
  # inject, but these caps keep it from flooding the SD card. RouterOS lines
  # are short — the whole fleet's real volume is far below these.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  per_stream_rate_limit: 2MB
  per_stream_rate_limit_burst: 8MB
  max_line_size: 16KB

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
