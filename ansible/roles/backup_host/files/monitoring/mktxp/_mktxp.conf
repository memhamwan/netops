[MKTXP]
    listen = '0.0.0.0:49090'
    socket_timeout = 5

    initial_delay_on_failure = 120
    max_delay_on_failure = 900
    delay_inc_div = 5

    fetch_routers_in_parallel = True
    max_worker_threads = 8
    max_scrape_duration = 30
    # must stay below prometheus's scrape_timeout (50s), or a slow round
    # drops the whole fleet's metrics for that cycle
    total_max_scrape_duration = 45

    verbose_mode = False
