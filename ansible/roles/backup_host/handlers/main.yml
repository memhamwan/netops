---
- name: restart sshd
  ansible.builtin.shell: sshd -t && systemctl restart ssh
  changed_when: true

- name: systemd reload
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart oxidized
  ansible.builtin.command: docker restart oxidized
  changed_when: true

- name: restart mktxp
  ansible.builtin.command: docker restart mktxp
  changed_when: true

- name: restart caddy
  ansible.builtin.command: docker restart caddy
  changed_when: true

- name: restart alertmanager
  ansible.builtin.command: docker restart alertmanager
  changed_when: true

- name: restart grafana
  ansible.builtin.command: docker restart grafana
  changed_when: true

- name: restart alloy
  ansible.builtin.command: docker restart alloy
  changed_when: true

- name: reapply firewall
  ansible.builtin.systemd:
    name: netops-firewall.service
    state: restarted
    daemon_reload: true

- name: reload monitoring
  ansible.builtin.shell: |
    docker compose -f {{ netops_opt }}/monitoring/docker-compose.yml up -d
    docker restart grafana
    curl -s -X POST http://127.0.0.1:9090/-/reload || true
  changed_when: true
