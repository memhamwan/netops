# Our own service endpoints
- labels: {site: sco, service: oxidized}
  targets: ["http://host.docker.internal:8888"]
- labels: {site: sco, service: grafana}
  targets: ["https://grafana.memhamwan.net/api/health"]
- labels: {site: sco, service: loki}
  targets: ["http://loki:3100/ready"]
- labels: {site: sco, service: alloy}
  targets: ["http://alloy:12345/-/ready"]
# can't deliver while alertmanager is down, but stays firing and delivers on
# recovery — and the outage is visible on the dashboards meanwhile
- labels: {site: sco, service: alertmanager}
  targets: ["http://alertmanager:9093/-/ready"]
