global:
  scrape_interval: 60s
  evaluation_interval: 60s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: node
    static_configs:
      # rpi.sco's native node-exporter binds the docker bridge (scraped locally
      # as host.docker.internal); remote service Pis bind their LAN IP.
      # `host`, not `device`: node-exporter uses `device` itself (filesystems,
      # NICs) — a static `device` label shadows it into exported_device and
      # silently breaks every per-device node query
      - targets: [host.docker.internal:9100]
        labels:
          site: sco
          host: rpi.sco
      - targets: [44.34.128.108:9100]
        labels:
          site: hil
          host: meshtastic.hil

  # RouterOS API metrics for the whole fleet via mktxp (one endpoint)
  - job_name: mktxp
    scrape_interval: 60s
    scrape_timeout: 50s
    static_configs:
      - targets: [mktxp:49090]

  # ICMP reachability of every RouterOS device (and UPSes). Targets are
  # rendered from the inventory: the recorded IP when there is one (monitoring
  # must not depend on DNS), hostname otherwise. `device` carries the short
  # hostname for alerts/dashboards (see targets/*.yml).
  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files: [/etc/prometheus/targets/icmp-*.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # DNS checks of the site service hosts. Targets are rendered from the
  # inventory (targets/dns-services.yml) and carry kind="unicast" for each
  # host's own address and kind="anycast" for the shared service addresses:
  # an anycast probe only ever tells you about the *nearest* instance, so the
  # per-instance truth has to be collected separately.
  - job_name: blackbox-dns-internal
    metrics_path: /probe
    params:
      module: [dns_internal]
    file_sd_configs:
      - files: [/etc/prometheus/targets/dns-*.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox-dns-recursion
    metrics_path: /probe
    params:
      module: [dns_recursion]
    file_sd_configs:
      - files: [/etc/prometheus/targets/dns-*.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # HTTP checks of our own services
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: [/etc/prometheus/targets/http-*.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
