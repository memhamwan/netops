# Managed by the netops linux_baseline role — do not edit on the host.

# rp_filter LOOSE (=2), not strict (=1): these hosts do anycast + OSPF, whose
# return paths are asymmetric — strict RPF would silently drop them. Loose
# still blocks bogons with no route at all. Effective = max(all, iface), so
# setting all+default to 2 forces loose everywhere deterministically.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# Routers neither send nor accept ICMP redirects.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0

# No source routing.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# Anti-spoof / DoS hygiene.
net.ipv4.tcp_syncookies = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Don't autoconfigure from RAs on a statically/OSPF-addressed router.
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# Anycast-on-shared-L2 ARP hygiene: never answer ARP for the /32 out the wrong
# interface, and prefer the primary address as source.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
