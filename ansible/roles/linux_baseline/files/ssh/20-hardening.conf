# Managed by the netops linux_baseline role — do not edit on the host.
# Key-only, internet-facing hardening. These boxes sit on publicly-routed
# 44net, so password auth is off and only members of the sshusers group get in.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 20
AllowGroups sshusers
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
ClientAliveInterval 300
ClientAliveCountMax 2
MaxSessions 6
