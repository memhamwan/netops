---
# Only reached when linux_baseline_is_sdcard is true. The big SD-write win —
# journald to RAM (Storage=volatile) — is deliberately NOT here: it moves the
# journal to /run/log/journal, which the log-ship agent must read, so it lands
# in P2 alongside the Alloy → Loki work (switching it on now would break the
# host-journal ingestion the monitoring host already does from /var/log/journal).
# P1 keeps only the shipping-independent reduction.
- name: Disable swap-to-SD (dphys-swapfile) if present
  ansible.builtin.systemd:
    name: dphys-swapfile
    enabled: false
    state: stopped
  failed_when: false
