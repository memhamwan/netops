---
- name: unattended-upgrades packages
  ansible.builtin.apt:
    name: [unattended-upgrades, apt-listchanges]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable periodic list-update + unattended-upgrade
  ansible.builtin.copy:
    src: apt/20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"

- name: Security-only unattended-upgrades policy
  ansible.builtin.template:
    src: 52unattended-upgrades-local.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    mode: "0644"
