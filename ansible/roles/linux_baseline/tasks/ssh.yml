---
# Templated (not static): the port and login-gate group come from role vars,
# so an inventory override actually takes effect in sshd's config.
#
# Install then validate the EFFECTIVE config. If sshd -t rejects it, restore
# each drop-in to what it was before this run (or remove it if it's new) so a
# later restart/reboot can't load a broken config and lock the host out — rpi.sco
# already carries a known-good 10-netops-ports.conf from the old backup_host
# task, and nuking it would drop the :222 port Ansible reconnects on.
- name: Install + validate sshd drop-ins (rolled back if invalid)
  block:
    - name: Snapshot any existing sshd drop-ins (for rollback)
      ansible.builtin.copy:
        src: "/etc/ssh/sshd_config.d/{{ item }}"
        dest: "/etc/ssh/sshd_config.d/.{{ item }}.netops-bak"
        remote_src: true
        mode: "0644"
      loop:
        - 10-netops-ports.conf
        - 20-hardening.conf
      failed_when: false   # no source = no prior file; nothing to snapshot
      changed_when: false

    - name: Install sshd drop-ins (ports + key-only hardening)
      ansible.builtin.template:
        src: "ssh/{{ item }}.j2"
        dest: "/etc/ssh/sshd_config.d/{{ item }}"
        mode: "0644"
      loop:
        - 10-netops-ports.conf
        - 20-hardening.conf
      notify: reload ssh

    - name: Validate sshd config
      ansible.builtin.command: sshd -t
      changed_when: false
      check_mode: false
  rescue:
    - name: Restore the previous drop-in (or remove it if it was newly added)
      ansible.builtin.shell: |
        bak="/etc/ssh/sshd_config.d/.{{ item }}.netops-bak"
        cur="/etc/ssh/sshd_config.d/{{ item }}"
        if [ -f "$bak" ]; then mv -f "$bak" "$cur"; else rm -f "$cur"; fi
      args:
        executable: /bin/bash
      loop:
        - 10-netops-ports.conf
        - 20-hardening.conf
      changed_when: true

    - name: Fail — sshd config was invalid, previous config restored
      ansible.builtin.fail:
        msg: >-
          sshd -t rejected the linux_baseline drop-ins; the previous config was
          restored so the host stays reachable on its configured port. Fix the
          template/vars and re-run.
  always:
    - name: Clean up any leftover snapshots
      ansible.builtin.file:
        path: "/etc/ssh/sshd_config.d/.{{ item }}.netops-bak"
        state: absent
      loop:
        - 10-netops-ports.conf
        - 20-hardening.conf
