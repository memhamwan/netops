---
# Templated (not static): the port and login-gate group come from role vars,
# so an inventory override actually takes effect in sshd's config.
- name: Install sshd drop-ins (ports + key-only hardening)
  ansible.builtin.template:
    src: "ssh/{{ item }}.j2"
    dest: "/etc/ssh/sshd_config.d/{{ item }}"
    mode: "0644"
  loop:
    - 10-netops-ports.conf
    - 20-hardening.conf
  notify: reload ssh

# Validate the EFFECTIVE config (the drop-ins are already in place) before the
# reload handler can run. A bad drop-in aborts the play here, so the reload
# never applies a config that would lock us out.
- name: Validate sshd config
  ansible.builtin.command: sshd -t
  changed_when: false
  check_mode: false
