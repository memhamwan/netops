---
# Bring the RouterBOARD firmware (bootloader) in line with the running RouterOS
# version. After the package upgrade + reboot, `upgrade-firmware` reflects the
# new RouterOS version while `current-firmware` still shows the old bootloader;
# `/system routerboard upgrade` writes it and it takes effect on the next reboot.

- name: Re-read RouterBOARD firmware state
  community.routeros.command:
    commands:
      - ':put [/system routerboard get current-firmware]'
      - ':put [/system routerboard get upgrade-firmware]'
  register: rb
  changed_when: false

- name: Record RouterBOARD firmware versions
  ansible.builtin.set_fact:
    # value is the LAST line of each command's block (RouterOS wraps echoed :put)
    rb_current_fw: "{{ rb.stdout_lines[0] | default(['']) | last | trim }}"
    rb_upgrade_fw: "{{ rb.stdout_lines[1] | default(['']) | last | trim }}"

- name: Report that the RouterBOARD firmware is already current
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} RouterBOARD firmware {{ rb_current_fw }} matches available {{ rb_upgrade_fw }}."
  when: rb_current_fw == rb_upgrade_fw

- name: Upgrade RouterBOARD firmware and reboot
  when: rb_current_fw != rb_upgrade_fw
  block:
    - name: Write the new RouterBOARD firmware
      community.routeros.command:
        commands:
          - '/system routerboard upgrade'
      changed_when: true

    - name: Reboot to apply the RouterBOARD firmware
      ansible.builtin.include_tasks: reboot_wait.yml
      vars:
        rw_reason: "RouterBOARD firmware {{ rb_upgrade_fw }}"
        rw_trigger_cmds:
          - '/system reboot'
