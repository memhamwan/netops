---
# DRAFT — never executed against a device. Review gate: see role README and the
# execution gate in playbooks/routeros_firmware.yml.
#
# Upgrades ONE RouterOS device. The playbook drives this role in TWO phases via
# `_fw_phase` (default 'all' when the role is used directly):
#
#   check  — read state, query the channel, decide os_upgrade_needed. No bytes
#            moved, no reboot. The playbook runs this in PARALLEL across the
#            fleet (cheap, low-bandwidth) and uses the results to prune the
#            serial phase to only the devices that actually need work.
#   apply  — download/upload the package and reboot, then upgrade RouterBOARD
#            firmware and verify. The playbook runs this SERIALLY, deepest-first,
#            one device at a time, so a shared radio backhaul never carries two
#            downloads at once.
#   all    — both, back-to-back, for a single device (direct role use / tests).
#
# Idempotent: a device already on the expected version and RouterBOARD firmware
# is left untouched — no reboot. In the check phase such a device sets
# _fw_needs_apply=false and the playbook drops it from the serial run entirely.

# ---------------------------------------------------------------------------
# CHECK phase — read-only assessment, safe to run in parallel.
# ---------------------------------------------------------------------------
- name: Read current firmware state
  community.routeros.command:
    commands:
      - ':put [/system resource get version]'
      - ':put [/system routerboard get current-firmware]'
      - ':put [/system routerboard get upgrade-firmware]'
      - ':put [/system routerboard get routerboard]'
      - ':put [/system resource get architecture-name]'
  register: pre
  changed_when: false
  when: _fw_phase | default('all') in ['check', 'all']

- name: Record current state
  ansible.builtin.set_fact:
    # RouterOS wraps the echoed :put command when it is wider than the terminal,
    # leaking echo lines into the output — and when a value is EMPTY only those
    # echo lines remain. So drop every echo line (they all contain :put, /system
    # or a '<' wrap marker) and take what's left; empty means empty. See
    # roles/routeros_firmware/README.md.
    # `/system resource get version` reads like "7.24.1 (stable)" — take the number.
    installed_version: "{{ (((pre.stdout_lines[0] | default([]) | reject('search', ':put|/system|<') | map('trim') | select | list) + ['']) | first).split(' ') | first }}"
    rb_current_fw: "{{ ((pre.stdout_lines[1] | default([]) | reject('search', ':put|/system|<') | map('trim') | select | list) + ['']) | first }}"
    rb_upgrade_fw: "{{ ((pre.stdout_lines[2] | default([]) | reject('search', ':put|/system|<') | map('trim') | select | list) + ['']) | first }}"
    is_routerboard: "{{ (((pre.stdout_lines[3] | default([]) | reject('search', ':put|/system|<') | map('trim') | select | list) + ['']) | first) == 'true' }}"
    arch_name: "{{ ((pre.stdout_lines[4] | default([]) | reject('search', ':put|/system|<') | map('trim') | select | list) + ['']) | first }}"
  when: _fw_phase | default('all') in ['check', 'all']

- name: Report the current state and plan for this device
  ansible.builtin.debug:
    msg: >-
      installed={{ installed_version }}
      routerboard={{ is_routerboard }}
      rb_current={{ rb_current_fw }}
      mode={{ 'offline' if (routeros_npk_source_dir | length > 0) else 'online:' ~ routeros_update_channel }}
      target={{ routeros_target_version if (routeros_target_version | length > 0) else 'latest' }}
  when: _fw_phase | default('all') in ['check', 'all']

- name: RouterOS package check (offline .npk)
  ansible.builtin.include_tasks: os_offline_check.yml
  when:
    - _fw_phase | default('all') in ['check', 'all']
    - routeros_npk_source_dir | length > 0

- name: RouterOS package check (online channel)
  ansible.builtin.include_tasks: os_online_check.yml
  when:
    - _fw_phase | default('all') in ['check', 'all']
    - routeros_npk_source_dir | length == 0

# Whether this device needs the (serial) apply phase at all: a RouterOS package
# upgrade, OR — even when already on the target version — a RouterBOARD firmware
# that lags the running OS. Devices where both are current are skipped entirely.
- name: Decide whether this device needs the apply phase
  ansible.builtin.set_fact:
    _fw_needs_apply: >-
      {{ (os_upgrade_needed | default(false) | bool)
         or ((routeros_upgrade_routerboard | bool)
             and (is_routerboard | bool)
             and (rb_current_fw != rb_upgrade_fw)) }}
  when: _fw_phase | default('all') in ['check', 'all']

# ---------------------------------------------------------------------------
# APPLY phase — moves bytes and reboots. The playbook runs this serially.
# ---------------------------------------------------------------------------
# The apply phase consumes facts the check phase set (expected_version,
# os_upgrade_needed, is_routerboard; arch_name in offline mode). In the playbook
# these persist from the check play; but running the role directly with
# _fw_phase=apply skips the check tasks, so fail fast with a clear message
# instead of a later undefined-variable error. (_fw_phase=all runs check inline,
# so it is exempt.)
- name: Apply phase requires the check phase to have run first
  ansible.builtin.assert:
    that:
      - expected_version is defined
      - os_upgrade_needed is defined
      - is_routerboard is defined
      - (routeros_npk_source_dir | length == 0) or (arch_name is defined)
    fail_msg: >-
      _fw_phase=apply but the check-phase facts are missing on
      {{ inventory_hostname }} (expected_version / os_upgrade_needed /
      is_routerboard). Run the check phase first — the playbook does this
      automatically across its plays; for a single device use _fw_phase=all.
    quiet: true
  when: _fw_phase | default('all') == 'apply'

- name: RouterOS package upgrade (offline .npk)
  ansible.builtin.include_tasks: os_offline_apply.yml
  when:
    - _fw_phase | default('all') in ['apply', 'all']
    - routeros_npk_source_dir | length > 0
    - os_upgrade_needed | default(false) | bool

- name: RouterOS package upgrade (online channel)
  ansible.builtin.include_tasks: os_online_apply.yml
  when:
    - _fw_phase | default('all') in ['apply', 'all']
    - routeros_npk_source_dir | length == 0
    - os_upgrade_needed | default(false) | bool

# --- RouterBOARD firmware (bootloader), after the OS is on the target ---
- name: RouterBOARD firmware upgrade
  ansible.builtin.include_tasks: routerboard.yml
  when:
    - _fw_phase | default('all') in ['apply', 'all']
    - routeros_upgrade_routerboard | bool
    - is_routerboard | bool

# --- Prove the end state (fails the run on mismatch) ---
- name: Verify the expected version
  ansible.builtin.include_tasks: verify.yml
  when: _fw_phase | default('all') in ['apply', 'all']
