---
# CHECK phase (online): decide what this device needs, WITHOUT moving bytes or
# rebooting. Sets expected_version and os_upgrade_needed. Safe to run in
# parallel across the whole fleet — check-for-updates is a tiny query to
# upgrade.mikrotik.com, not the (bandwidth-heavy) package download, which is
# deferred to os_online_apply.yml in the serial phase.

- name: Set the update channel to {{ routeros_update_channel }}
  community.routeros.command:
    commands:
      - '/system package update set channel={{ routeros_update_channel }}'
  # convergent set; RouterOS returns nothing and re-setting is a no-op
  changed_when: false

- name: Check for updates on the configured channel
  community.routeros.command:
    commands:
      - '/system package update check-for-updates'
  changed_when: false

# check-for-updates is asynchronous ("status: checking for updates" until the
# server answers); poll until it settles, then read the versions it reported.
- name: Wait for the update check to finish
  community.routeros.command:
    commands:
      - ':put [/system package update get status]'
      - ':put [/system package update get latest-version]'
  register: fw_check
  # strip wrapped-echo lines, take the real value (empty stays empty)
  until: (((fw_check.stdout_lines[0] | default([]) | reject('search', ':put|/system|<') | map('trim') | select | list) + ['']) | first) is not search('(?i)checking')
  retries: 12
  delay: 5
  changed_when: false

- name: Record the channel's latest version
  ansible.builtin.set_fact:
    update_status: "{{ ((fw_check.stdout_lines[0] | default([]) | reject('search', ':put|/system|<') | map('trim') | select | list) + ['']) | first }}"
    latest_version: "{{ ((fw_check.stdout_lines[1] | default([]) | reject('search', ':put|/system|<') | map('trim') | select | list) + ['']) | first }}"

- name: Fail if the update check could not reach MikroTik's servers
  ansible.builtin.assert:
    that: latest_version | length > 0
    fail_msg: >-
      check-for-updates returned no latest-version on {{ inventory_hostname }}
      (status: '{{ update_status }}'). The device could not reach
      upgrade.mikrotik.com — usually no/broken DNS on the device
      (`/ip dns print` shows empty servers) or no internet path. Fix DNS on the
      device (routeros_baseline/site_services), or upgrade offline by staging the
      .npk and setting routeros_npk_source_dir.

- name: Establish the expected end-state version
  ansible.builtin.set_fact:
    # target pins the version; otherwise "latest" is whatever the channel serves
    expected_version: "{{ routeros_target_version if (routeros_target_version | length > 0) else latest_version }}"

# Never reboot toward a version we cannot actually install online: if a target
# was pinned but the channel is not serving it, stop before touching the device.
- name: Fail fast when the channel cannot deliver the pinned target
  ansible.builtin.assert:
    that: latest_version == routeros_target_version
    fail_msg: >-
      Channel '{{ routeros_update_channel }}' offers {{ latest_version }}, not
      the requested {{ routeros_target_version }}. Choose the channel that
      publishes {{ routeros_target_version }}, or supply the .npk offline
      (routeros_npk_source_dir). Not rebooting {{ inventory_hostname }}.
  when: routeros_target_version | length > 0

- name: Decide whether a RouterOS package upgrade is needed
  ansible.builtin.set_fact:
    os_upgrade_needed: "{{ installed_version != expected_version }}"

# Fail-fast in the parallel check phase means a v6 box deep in the chain is
# caught BEFORE any device in the campaign reboots — not partway through the
# serial run after earlier devices already upgraded.
- name: Refuse an unintended v6 -> v7 major jump
  ansible.builtin.assert:
    that: >-
      (installed_version.split('.')[0] != '6')
      or (expected_version.split('.')[0] != '7')
      or (routeros_allow_major_upgrade | bool)
    fail_msg: >-
      {{ inventory_hostname }} would jump {{ installed_version }} ->
      {{ expected_version }} (v6 -> v7 major migration). Review the config
      migration for this device, then pass -e routeros_allow_major_upgrade=true.
  when: os_upgrade_needed | bool

- name: Report that the RouterOS package is already on target
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} already on {{ installed_version }}; no package upgrade needed."
  when: not (os_upgrade_needed | bool)
