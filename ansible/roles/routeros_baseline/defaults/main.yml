---
# DRAFT — this role has never been executed. See role README.
collector_ip: 44.34.128.45
# sources allowed to reach the RouterOS API; extend per-run for laptop use:
#   -e '{"api_extra_sources": ["44.34.128.60/32"]}'
api_allowed_sources: "{{ [collector_ip ~ '/32'] + (api_extra_sources | default([])) }}"

ntp_servers:
  - 44.34.128.181        # ntp.leb
  - 44.34.133.3
  # off-network fallback (LEB outage lesson, sec1.sco drift) — numeric
  # anycast addresses for time.cloudflare.com, because the same LEB outage
  # takes internal DNS down and a hostname fallback would be unresolvable
  # exactly when it's needed
  - 162.159.200.1
  - 162.159.200.123

syslog_topics: [system, error, warning, critical, account]

# users the fleet is EXPECTED to have; anything else is reported by audit.yml
expected_users:
  - admin
  - ansible
  - oxidized
  - oxidized-full
  - mktxp
# current netops humans — accounts outside expected_users + this list are
# flagged by the audit. Public keys live in files/operators/ (seichold's from
# their GitHub profile; ae5au's pending — no keys published on GitHub, needs
# out-of-band collection).
operators:
  - turnrye
  - seichold
  - ae5au

service_groups:
  - {name: netops-backup-ro, policy: "ssh,read"}
  - {name: netops-backup-full, policy: "ssh,read,sensitive"}
  - {name: mktxp_group, policy: "api,read"}
  - {name: netops-ansible, policy: "api,ssh,ftp,read,write,policy,test"}

# RouterOS stores group policies in canonical form: granted policies in this
# fixed order, then the rest negated (!) in the same order. api_modify
# compares strings, so the role expands service_groups to that exact form —
# otherwise every run re-reports the same "change" forever (verified live on
# sec3.sco). ROS 7.12 universe; if a future ROS adds a policy, runs go
# perpetually-changed again until it's appended here.
routeros_policy_universe:
  - local
  - telnet
  - ssh
  - ftp
  - reboot
  - read
  - write
  - policy
  - test
  - winbox
  - password
  - web
  - sniff
  - sensitive
  - api
  - romon
  - rest-api
