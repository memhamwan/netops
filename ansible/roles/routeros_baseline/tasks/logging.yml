---
# Remote syslog to the collector. RouterOS changed the action schema in 7.18
# (bsd-syslog= → remote-log-format=), so try new-schema first and fall back.
# TODO(review): once fleet is 7.18+, drop the rescue branch.
- name: Configure remote logging action (7.18+ schema)
  block:
    - community.routeros.api_modify:
        path: system logging action
        data:
          - {name: remote, target: remote, remote: "{{ collector_ip }}",
             remote-port: 514, remote-log-format: syslog}
  rescue:
    - name: Configure remote logging action (pre-7.18 schema)
      community.routeros.api_modify:
        path: system logging action
        data:
          - {name: remote, target: remote, remote: "{{ collector_ip }}",
             remote-port: 514, bsd-syslog: true}

- name: Fetch current logging rules
  community.routeros.api:
    path: system logging
  register: baseline_logrules

- name: Add missing remote logging rules
  community.routeros.api:
    path: system logging
    add: "action=remote topics={{ item }}"
  loop: "{{ syslog_topics }}"
  when: >-
    baseline_logrules.msg
    | selectattr('action', 'defined') | selectattr('action', 'eq', 'remote')
    | selectattr('topics', 'defined') | selectattr('topics', 'eq', item)
    | list | length == 0
