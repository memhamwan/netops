---
# Imported LAST on purpose: this changes the API services over the API
# connection itself. Run from a controller outside api_allowed_sources, it
# cuts off its own transport — by running last, the rest of the baseline is
# already applied when it does.
#
# Target state: api-ssl (8729, per-device cert from onboard_device.yml)
# restricted to the management sources; plaintext api (8728) disabled — its
# ACL never protected the credentials from passive capture on radio links.
# two tasks, in this order: disabling 8728 is safe (this session runs on
# 8729), while the api-ssl source ACL can sever the session — if it does,
# the plaintext disable must already have landed
- name: Disable plaintext api
  community.routeros.api_modify:
    path: ip service
    data:
      - {name: api, disabled: true}

# the allow-list property is `available-from` from 7.24, `address` before
- name: Restrict api-ssl to allowed sources (very last — can sever this session)
  community.routeros.api_modify:
    path: ip service
    data:
      - "{{ {'name': 'api-ssl', 'disabled': false, 'port': 8729, 'certificate': 'api-ssl', source_key: api_allowed_sources | join(',')} }}"
  vars:
    source_key: "{{ 'available-from' if routeros_version is version('7.24', '>=') else 'address' }}"
