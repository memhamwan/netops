---
# Service groups and group membership. Deliberately does NOT create users:
# creation (with random throwaway passwords + ssh-key upload) stays in the
# bootstrap/onboarding plays, so this role can never produce a passwordless
# account. It corrects group/policy drift on accounts that already exist.
- name: Ensure service groups exist with expected policies
  community.routeros.api_modify:
    path: user group
    data: "{{ service_groups }}"

- name: Fetch current users
  community.routeros.api:
    path: user
  register: baseline_users

# per-account, so a device missing one service account (not yet onboarded for
# that function) still gets the others corrected
- name: Correct group membership of service accounts
  community.routeros.api_modify:
    path: user
    data:
      - {name: "{{ item.name }}", group: "{{ item.group }}"}
  loop:
    - {name: oxidized, group: netops-backup-ro}
    - {name: oxidized-full, group: netops-backup-full}
    - {name: mktxp, group: mktxp_group}
    - {name: ansible, group: netops-ansible}
  when: item.name in (baseline_users.msg | map(attribute='name') | list)
