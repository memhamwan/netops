---
# Review gate and run history: see role README. Account drift (unexpected
# users and keys) is reported by routeros_audit and removed by
# routeros_remediate, not here.
- name: Service groups + membership
  ansible.builtin.import_tasks: users.yml
- name: Service lockdown
  ansible.builtin.import_tasks: services.yml
- name: Remote syslog
  ansible.builtin.import_tasks: logging.yml
- name: NTP
  ansible.builtin.import_tasks: ntp.yml
- name: DNS resolvers
  ansible.builtin.import_tasks: dns.yml
- name: FQDN identity
  ansible.builtin.import_tasks: identity.yml
- name: API source restriction (last — can sever this session)
  ansible.builtin.import_tasks: api_lockdown.yml
