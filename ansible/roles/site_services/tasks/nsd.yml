---
# Authoritative DNS (NSD). Mirrors the anycast gate: entirely inert while
# nsd_enabled is false — NSD is stopped and disabled if present (the package
# and config are left in place, like the anycast teardown leaves frr), and
# unbound keeps serving the internal zone from local-data as before. When
# enabled, NSD serves
# the inventory-rendered zone authoritatively on the authdns anycast /32s +
# 127.0.0.1@{{ nsd_stub_port }}, and unbound resolves the internal zone via a
# stub-zone to it (see unbound.yml). See docs/dns-authority-design.md.

- name: NSD disabled — authoritative DNS stays off
  when: not (nsd_enabled | bool)
  block:
    # Reconcile path back from a prior enabled deploy: a running NSD would keep
    # answering on the authdns /32s while unbound has reverted to local-data.
    - name: Is NSD installed?
      ansible.builtin.stat:
        path: /lib/systemd/system/nsd.service
      register: nsd_unit

    - name: Stop and disable NSD
      ansible.builtin.systemd:
        name: nsd
        state: stopped
        enabled: false
      when: nsd_unit.stat.exists

- name: NSD enabled
  when: nsd_enabled | bool
  block:
    # unbound switches to explicit interface binds in NSD mode and binds this
    # host's own address. It must be a real IP: with gather_facts off and FQDN
    # inventory names, ansible_host is the FQDN, so an unset `ip` would render a
    # config that templates fine but cannot bind. Fail fast, here, with a clear
    # message rather than at unbound start-up.
    - name: Service host needs an inventory `ip` before NSD can be enabled
      ansible.builtin.assert:
        that:
          - ip is defined
          # dotted-quad shape check (no ansible.utils dependency) — enough to
          # reject an unset ip or an accidental hostname; anchored both ends.
          - ip | string is match('^(\d{1,3}\.){3}\d{1,3}$')
        fail_msg: >-
          nsd_enabled is true but {{ inventory_hostname }} has no usable
          inventory `ip:`. Set it (an IPv4 address) in the inventory — unbound
          binds it explicitly in NSD mode and cannot bind a hostname.
        quiet: true

    # policy_rc_d 101 blocks the package's auto-start: the stock nsd.conf listens
    # on all interfaces, so a postinst start would try to grab :53 and collide
    # with unbound (still bound to the recursive anycast IPs). NSD is started
    # explicitly at the end of this file, once its restricted config is in place.
    - name: NSD package (do not auto-start on install)
      ansible.builtin.apt:
        name: nsd
        state: present
        update_cache: true
        cache_valid_time: 3600
        policy_rc_d: 101

    - name: Zones directory
      ansible.builtin.file:
        path: /etc/nsd/zones
        state: directory
        owner: root
        group: nsd
        mode: "0750"

    - name: Install NSD server config
      ansible.builtin.template:
        src: nsd.conf.j2
        dest: /etc/nsd/nsd.conf.d/netops.conf
        mode: "0644"
      notify: restart nsd

    - name: Render the forward zone
      ansible.builtin.template:
        src: nsd-zone-forward.j2
        dest: "/etc/nsd/zones/{{ dns_zone }}.zone"
        owner: root
        group: nsd
        mode: "0640"
      notify: restart nsd

    # reverse_zone drives the $ORIGIN and the /24 the PTRs are filtered to.
    - name: Render the reverse zones
      ansible.builtin.template:
        src: nsd-zone-reverse.j2
        dest: "/etc/nsd/zones/{{ item }}.zone"
        owner: root
        group: nsd
        mode: "0640"
      loop: "{{ dns_reverse_zones }}"
      vars:
        reverse_zone: "{{ item }}"
      notify: restart nsd

    # nsd-checkconf validates only the server config — it does NOT parse the
    # zonefiles, so a malformed zone would sail through here and then wedge NSD
    # on restart. Check the config, then check every zonefile explicitly.
    - name: Validate the NSD server configuration
      ansible.builtin.command: nsd-checkconf /etc/nsd/nsd.conf
      changed_when: false

    # Every zone renders to /etc/nsd/zones/<zone>.zone (forward + each reverse),
    # so the file path follows from the name.
    - name: Validate every rendered zonefile
      ansible.builtin.command: "nsd-checkzone {{ item }} /etc/nsd/zones/{{ item }}.zone"
      changed_when: false
      loop: "{{ [dns_zone] + dns_reverse_zones }}"

    - name: Enable NSD
      ansible.builtin.systemd:
        name: nsd
        enabled: true
        state: started
        daemon_reload: true
