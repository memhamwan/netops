---
# Deploys DNS + NTP (and, when anycast_enabled, the OSPF announcement) to a
# site service host. Native systemd services, not containers: everything else
# on the network — including docker pulls and alert delivery — depends on
# these, so they must not share fate with the container runtime.
- name: Service packages
  ansible.builtin.apt:
    name: [unbound, chrony, bind9-dnsutils]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: State + textfile directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ site_services_var }}"
    - "{{ site_services_textfile_dir }}"
    - /opt/netops/site-services

# Both the resolver and the anycast interface need to know whether NM is the
# one managing interfaces/resolv.conf on this host.
- name: Is NetworkManager in play?
  ansible.builtin.stat:
    path: /etc/NetworkManager
  register: nm_dir

# ── NSD / unbound :53 hand-off ─────────────────────────────────────────────
# unbound binds the 0.0.0.0:53 wildcard in local-data mode and explicit per-
# address binds (excluding the authdns /32s) in NSD mode; NSD binds
# 44.34.132.53/.133.53. A wildcard bind and a specific-address bind on :53 are
# mutually exclusive, so the socket must change hands in a fixed order. Two rules
# govern the sequence below:
#
#   1. Validate before you switch. NSD is installed (auto-start blocked),
#      rendered, and nsd-check'd FIRST, while unbound is still authoritative from
#      local-data. Prep binds no socket, so it can't collide with the wildcarded
#      unbound; and if anything fails, the play aborts before unbound is touched,
#      so the internal zone never goes dark on a failed enable.
#   2. Releaser restarts before claimer. The restarts are pending handlers, and
#      handlers/main.yml defines "restart unbound" before "restart nsd", so a
#      single flush restarts unbound onto its new binds first, then NSD:
#        • enabling  — unbound frees the wildcard, then NSD starts onto the /32s
#          (the render tasks in nsd.yml notified "restart nsd"). The internal-
#          zone SERVFAIL window is just the gap between those two restarts.
#        • disabling — NSD is stopped below (freeing the /32s) before the flush,
#          then unbound reclaims the wildcard. Letting the wildcard restart fire
#          while a prior-deploy NSD still holds the /32s is the teardown
#          address-in-use bug this ordering avoids.

# Rule 1: prep + validate NSD before unbound switches (inert when disabled).
- name: Prepare + validate authoritative DNS (NSD)
  ansible.builtin.import_tasks: nsd.yml

- name: Configure unbound
  ansible.builtin.import_tasks: unbound.yml

# DISABLE path: stop a prior-deploy NSD — it would otherwise keep answering on
# the authdns /32s while unbound reverts to local-data — BEFORE unbound reclaims
# the wildcard at the flush below.
- name: Stop NSD before unbound reclaims the :53 wildcard (teardown)
  when: not (nsd_enabled | bool)
  block:
    - name: Is NSD installed?
      ansible.builtin.stat:
        path: /lib/systemd/system/nsd.service
      register: nsd_unit

    - name: Stop and disable NSD
      ansible.builtin.systemd:
        name: nsd
        state: stopped
        enabled: false
      when: nsd_unit.stat.exists

# Rule 2: the socket hand-off. Flushes the pending restarts in handler-definition
# order — unbound first (freeing :53 on enable / reclaiming it on disable), then
# NSD onto the authdns /32s if its prep notified a restart.
- name: Restart unbound (then NSD) onto their new :53 binds
  ansible.builtin.meta: flush_handlers

# The render handler (re)starts NSD on a config change, but a no-op converge
# must still bring back a stopped-but-enabled NSD. Idempotent once running, and
# safe here — never during prep — because unbound has just freed the wildcard.
- name: Ensure NSD is running (enable path)
  when: nsd_enabled | bool
  ansible.builtin.systemd:
    name: nsd
    state: started

- name: Configure chrony
  ansible.builtin.import_tasks: chrony.yml

- name: Configure anycast (dummy interface, frr, announcement)
  ansible.builtin.import_tasks: anycast.yml

- name: Install health check + metrics
  ansible.builtin.import_tasks: healthcheck.yml
